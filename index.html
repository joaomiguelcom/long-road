  const syncHtml = '<span class="dot" aria-hidden="true"></span>' +
    // phones drop "Updated" and the year so it fits next to the title
    (() => { const d = new Date(DATA.generatedAt); return '<span><span class="sync-long">Updated </span>' + d.getDate() + " " + mon(d) + '<span class="sync-long"> ' + d.getFullYear() + "</span>, " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) + "</span>"; })();
  document.getElementById("sync").innerHTML = syncHtml;
  // the footer has room for the whole date and time
  document.getElementById("syncFoot").innerHTML = (() => {
    const d = new Date(DATA.generatedAt);
    return '<span class="dot" aria-hidden="true"></span><span>updated ' + d.getDate() + " " + mon(d) + " " + d.getFullYear() + " at " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) + "</span>";
  })();

  // ---------- aggregations ----------
  // concerts are newest first, so every Map below is filled in order of last seen; the sorts are stable and keep that order on ties
  const countBy = (list, keyFn) => {
    const m = new Map();
    for (const x of list) { const k = keyFn(x); if (k == null || k === "") continue; m.set(k, (m.get(k) || 0) + 1); }
    return [...m.entries()].map(([key, count]) => ({ key, count })).sort((a, b) => b.count - a.count);
  };
  const artists = countBy(concerts, (c) => c.artist);
  const venueKey = (c) => c.venue + "||" + (c.city || "");
  const venues = countBy(concerts.filter((c) => !c.festival), venueKey).map((v) => { const [name, city] = v.key.split("||"); return { ...v, name, city, country: (concerts.find((c) => !c.festival && venueKey(c) === v.key) || {}).country || "" }; });
  const festivals = (() => {
    const m = new Map();
    for (const c of concerts) if (c.festival) {
      const f = m.get(c.festival) || { name: c.festival, concerts: 0, days: new Set(), years: new Set(), countries: {} };
      f.concerts++; f.days.add(c.date); f.years.add(c.date.slice(0, 4)); f.countries[c.country] = (f.countries[c.country] || 0) + 1; m.set(c.festival, f);
    }
    return [...m.values()].map((f) => ({ name: f.name, concerts: f.concerts, days: f.days.size, count: f.years.size, years: [...f.years].sort(),
      country: Object.entries(f.countries).sort((a, b) => b[1] - a[1])[0][0] }))
      .sort((a, b) => b.count - a.count);
  })();
  const cities = countBy(concerts, (c) => c.city);
  const countries = countBy(concerts, (c) => c.country);
  const byYear = countBy(concerts, (c) => c.date.slice(0, 4)).sort((a, b) => a.key.localeCompare(b.key));
  const byMonth = countBy(concerts, (c) => c.date.slice(0, 7));
  // artist with the longest gap between two consecutive shows
  const reunion = (() => {
    const last = new Map(); let best = null;
    for (let i = concerts.length - 1; i >= 0; i--) {
      const c = concerts[i], prev = last.get(c.artist);
      if (prev && prev !== c.date) { const days = Math.round((Date.parse(c.date) - Date.parse(prev)) / DAY); if (!best || days > best.days) best = { artist: c.artist, days, from: prev, to: c.date }; }
      last.set(c.artist, c.date);
    }
    return best;
  })();
  const weekdayOf = (d) => new Date(d + "T12:00:00").toLocaleDateString("en-GB", { weekday: "long" });
  const weekdays = countBy(concerts, (c) => weekdayOf(c.date));
  const firstSeen = new Map();   // artist -> date of the first concert
  for (let i = concerts.length - 1; i >= 0; i--) if (!firstSeen.has(concerts[i].artist)) firstSeen.set(concerts[i].artist, concerts[i].date);

  // a song belongs to whoever wrote it: Alive played by Eddie Vedder is still Pearl Jam's Alive
  const songOwner = (s, c) => s.cover || c.artist;
  const songKey = (s, c) => plain(s.name) + "||" + plain(songOwner(s, c));
  const HOME = [41.15, -8.61];   // Porto: distances start here
  const songMap = new Map();      // by song, for the Songs tab
  const playedMap = new Map();    // by the artist on stage, for artist pages
  let songsHeard = 0;
  for (const c of concerts) for (const s of c.songs || []) {
    if (s.tape || !s.name) continue;
    songsHeard++;
    const k = songKey(s, c);
    const e = songMap.get(k) || { key: k, name: s.name, artist: songOwner(s, c), count: 0, by: new Set() };
    e.count++; if (c.artist !== e.artist) e.by.add(c.artist); songMap.set(k, e);
    const pk = s.name + "||" + c.artist;
    // key: the song page for this song (its owner may differ from who played it)
    const p = playedMap.get(pk) || { name: s.name, artist: c.artist, count: 0, key: k };
    p.count++; playedMap.set(pk, p);
  }
  // artists seen both in Portugal and abroad (the "Home and away" fun fact and artist list)
  const homeAwaySet = new Set([...new Set(concerts.map((c) => c.artist))].filter((a) => {
    const l = concerts.filter((c) => c.artist === a);
    return l.some((c) => c.country === "Portugal") && l.some((c) => c.country && c.country !== "Portugal");
  }));
  const songs = [...songMap.values()].sort((a, b) => b.count - a.count);
  const songsOnStage = [...playedMap.values()].sort((a, b) => b.count - a.count);

  // oldest first, same-day ties by setlist id (stable whatever order the API returns)
  // setlist.fm has no stage times, so the order of same-day concerts is arbitrary.
  // Reached milestones are frozen here by setlist id and never recalculated; add each new one when it is reached.
  const FIXED_MILESTONES = {
    concerts: { 1: "4beb2b76", 50: "53d473f9", 100: "3bd3606c", 250: "bd059de", 500: "3a25d33", 750: "43b43717", 1000: "3b502018" }
  };
  // oldest first; same-day ties broken by setlist id, then each frozen milestone is moved to its number within its day
  const chrono = concerts.slice().sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  Object.entries(FIXED_MILESTONES.concerts).forEach(([n, id]) => {
    const from = chrono.findIndex((c) => c.id === id), to = n - 1;
    if (from >= 0 && chrono[to] && chrono[to].date === chrono[from].date) chrono.splice(to, 0, chrono.splice(from, 1)[0]);
  });
  const chronoIdx = new Map(chrono.map((c, i) => [c.id, i]));
  const firstHeard = new Map();   // songKey -> id of the concert where João first heard the song, whoever played it
  for (const c of chrono) for (const s of c.songs || []) if (!s.tape && s.name && !firstHeard.has(songKey(s, c))) firstHeard.set(songKey(s, c), c.id);

  // competition ranking: ties share a rank (1, 2, 2, 4), like setlist.fm
  const withRank = (list) => { let r = 0; return list.map((x, i) => { if (i === 0 || x.count !== list[i - 1].count) r = i + 1; x.rank = r; return x; }); };
  [artists, venues, festivals, songs, countries].forEach(withRank);

  // longest streak of consecutive days with a concert, and longest gap
  const days = [...new Set(concerts.map((c) => c.date))].sort();
  let best = { len: 0 }, cur = { len: 0 }, gap = { days: 0 };
  for (let i = 0; i < days.length; i++) {
    const t = Date.parse(days[i]);
    const prev = i ? Date.parse(days[i - 1]) : null;
    if (prev !== null && t - prev === DAY) { cur.len++; cur.end = days[i]; }
    else cur = { len: 1, start: days[i], end: days[i] };
    if (cur.len > best.len) best = { ...cur };
    if (prev !== null && (t - prev) / DAY > gap.days) gap = { days: Math.round((t - prev) / DAY), from: days[i - 1], to: days[i] };
  }
  const oldest = concerts[concerts.length - 1];
  const artistSpan = (name) => { const l = concerts.filter((c) => c.artist === name); return { first: l[l.length - 1].date, last: l[0].date }; };

  // rarities: covers heard live and songs seen on their live debut
  // real live debuts only: "tour debut" or "first time live since 2017" are not
  const LIVE_DEBUT = /live debut|first time ever|first time live(?! since)|live premiere|world premiere/i;
  const coverMap = new Map();
  const debuts = [];
  for (const c of concerts) for (const s of c.songs || []) {
    if (s.tape || !s.name) continue;
    if (s.cover) {
      const k = s.name + "||" + s.cover + "||" + c.artist;
      const e = coverMap.get(k) || { name: s.name, original: s.cover, artist: c.artist, count: 0 };
      e.count++; coverMap.set(k, e);
    }
    if (s.info && LIVE_DEBUT.test(s.info)) debuts.push({ name: s.name, artist: c.artist, date: c.date, id: c.id, info: s.info });
  }
  const covers = [...coverMap.values()].sort((a, b) => b.count - a.count);
  const heardOnce = songs.filter((s) => s.count === 1).length;

  // ---------- rendering helpers ----------
  // select styled as a filter chip; opts are [value, text], the first one is "everything"
  // prefix is shown only on the chip ("Sort: Artist"); o[2] adds attributes to an option; attrs go on the select
  const qpick = (id, label, opts, cur, prefix, attrs) => {
    const on = opts.find((o) => o[0] === cur) || opts[0];
    return '<span class="toggle qpick' + (cur ? " on" : "") + '" data-label="' + (label === "Sort" ? "Sort by" : label) + '"><span data-any="' + (label === "Sort" ? "Default" : "Any") + '">' + (cur ? (prefix || "") + esc(on[1].replace(/ \([\d,]+\)$/, "")) : esc(label)) + '</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>' +
      '<select id="' + id + '" aria-label="' + label + '"' + (attrs || "") + ">" + opts.map((o) => '<option value="' + esc(o[0]) + '"' + (o[2] || "") + (o[0] === cur ? " selected" : "") + ">" + esc(o[1]) + "</option>").join("") + "</select></span>";
  };
  // options for a filter chip: the values found in list (already narrowed by the other filters) with their counts;
  // the current choice stays even when nothing is left for it
  const facet = (list, keyFn, cur, allLabel, newestFirst) => {
    let xs = countBy(list, keyFn);
    if (newestFirst) xs.sort((a, b) => b.key.localeCompare(a.key));
    if (cur && !xs.some((x) => x.key === cur)) xs.unshift({ key: cur, count: 0 });
    return [["", allLabel]].concat(xs.map((x) => [x.key, x.key + " (" + x.count + ")"]));
  };
  // round × at the end of a filter row while any of its filters (or the sort) is on
  const clearAll = (on, scope) => on || state.sorts[scope] ? '<button type="button" class="toggle clear-all" data-clear="' + scope + '" aria-label="Clear all filters" title="Clear all filters">' +
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>' : "";
  // share icon used by the image buttons (concert page, Year in review)
  const SHARE_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>';
  const fattr = (f, v, y) => ' data-f="' + f + '" data-v="' + esc(v) + '"' + (y ? ' data-y="' + esc(y) + '"' : "");
  const aattr = (name) => ' data-artist="' + esc(name) + '"';
  // attrFn(x) returns [field, value, year?] (opens the concert list filtered) or an attribute string
  // valueFn: optional text for the number on the right (default: the count)
  const bars = (list, labelFn, attrFn, valueFn) => {
    const top = list[0] ? list[0].count : 1;
    return '<ol class="bars">' + list.map((x) => {
      const at = attrFn ? attrFn(x) : null;
      const inner = '<div class="row"><span>' + (x.rank ? '<span class="rank">' + x.rank + "</span>" : "") + labelFn(x) + "</span><span>" + (valueFn ? valueFn(x) : x.count) + "</span></div>" +
        '<div class="track"><div class="fill" style="width:' + Math.max(2, Math.round(x.count / top * 100)) + '%"></div></div>';
      return "<li>" + (at ? '<button type="button" class="barbtn"' + (typeof at === "string" ? at : fattr(...at)) + ">" + inner + "</button>" : '<div class="barbtn static">' + inner + "</div>") + "</li>";
    }).join("") + "</ol>";
  };
  // act: optional click attributes (fattr, aattr, data-tab, data-open, data-yr); the whole card becomes a button
  const box = (cls, act, inner) => act ? '<button type="button" class="' + cls + '"' + act + ">" + inner + "</button>" : '<div class="' + cls + '">' + inner + "</div>";
  const kpi = (label, value, extra, act) => box("card", act, '<div class="kpi-label">' + label + '</div><div class="kpi">' + value + "</div>" + (extra ? '<div class="kpi-label">' + extra + "</div>" : ""));
  const fun = (label, big, small, act) => box("card fun", act, '<div class="kpi-label">' + label + '</div><div class="big">' + big + '</div><div class="small">' + (small || "") + "</div>");
  const tabAttr = (t) => ' data-tab="' + t + '"';
  const openAttr = (c) => ' data-open="' + esc(c.id) + '"';
  const yrAttr = (y) => ' data-yr="' + esc(y) + '"';
  const searchBox = (id, label, placeholder, value, side) => (side ? '<div class="sbar">' : "") + '<div class="search"><label for="' + id + '" class="sr-only">' + label + "</label>" +
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A9099" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
    '<input id="' + id + '" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" placeholder="' + placeholder + '" value="' + esc(value) + '"></div>' + (side ? side + "</div>" : "");
  // Phones (João, 2026-10-28): the filters of a list live in a panel that slides up from the bottom (body.fs-open).
  // A Filters button sits in the search box and the active filters show as chips under it; desktop keeps the row of chips.
  const SLIDERS = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>';
  const fsCount = (scope, n) => n + (state.sorts[scope] ? 1 : 0);
  // target: which panel the button opens ("main" is the page's own; the Songs page has one per list)
  let fsOpen = null;
  const fsBtn = (n, label, target) => '<button type="button" class="fbtn" data-fs="' + (target || "main") + '" aria-label="' + (label || "Filters") + (n ? ", " + n + " on" : "") + '">' + SLIDERS + (label || "Filters") + (n ? '<span class="badge">' + n + "</span>" : "") + "</button>";
  // chips: [label, state key]; × clears that one filter
  const SORT_LABELS = {};
  const sortChip = (scope) => { const st = state.sorts[scope]; return st ? [[(SORT_LABELS[scope] || [])[st.col] || "Sorted", st.dir > 0 ? " ↑" : " ↓"].join(""), "sort:" + scope] : null; };
  // puts an extra chip (built elsewhere) at the start of the phone's chips row, creating the row when it is empty
  const withChip = (row, chip) => !chip ? row : row ? row.replace('<div class="fchips">', '<div class="fchips">' + chip) : '<div class="fchips">' + chip + "</div>";
  const fsChips = (scope, chips) => (chips = sortChip(scope) ? chips.concat([sortChip(scope)]) : chips) && chips.length ? '<div class="fchips">' + chips.map(([label, key]) => '<button type="button" class="fchip" data-unset="' + key + '" aria-label="Remove ' + esc(label) + '">' + esc(label) +
    '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>').join("") +
    (chips.length > 1 ? '<button type="button" class="link" data-clear="' + scope + '">Clear all</button>' : "") + "</div>" : "";
  // on desktop the panel is the usual row (.fs-panel is display: contents there)
  // clear: scope of the "Clear all" link shown in the panel's head while anything is set
  const fsSheet = (inner, done, head, cls, clear, sid) => '<div class="quick fsheet' + (cls ? " " + cls : "") + (fsOpen === (sid || "main") ? " open" : "") + '" data-sheet="' + (sid || "main") + '"><button type="button" class="fs-scrim" data-fs="close" tabindex="-1" aria-label="Close"></button><div class="fs-panel" role="dialog" aria-label="' + (head || "Filters") + '">' +
    '<div class="fs-grab" aria-hidden="true"></div><div class="fs-head">' + (head || "Filters") + (clear ? '<button type="button" class="link" data-clear="' + clear + '">Clear all</button>' : "") + "</div>" + inner + (done ? '<button type="button" class="fs-done" data-fs="close">' + done + "</button>" : "") + "</div></div>";
  // lists whose filter row becomes the panel, with the noun for its "Show N …" button
  const SHEETS = { concerts: "concert", artists: "artist", venues: "venue", festivals: "festival", songs: "song", covers: "cover", debuts: "debut" };
  const SUB_SHEETS = ["covers", "debuts"];
  const artistBtn = (name, cls) => '<button type="button" class="' + (cls || "open") + '"' + aattr(name) + ">" + esc(name) + "</button>";
  const notes = (c) => (c.festival ? '<span class="accent">' + esc(c.festival) + "</span>" : "") + (c.festival && c.tour ? "<br>" : "") + (c.tour ? '<span class="tag">' + esc(c.tour) + "</span>" : "");
  // "Show all N" under a list cut to its first items; open lists are kept per key while the page lives
  const opened = new Set();
  const isOpen = (k) => opened.has(k);
  const moreBtn = (k, total, cut) => total > cut ? '<button type="button" class="link" data-expand="' + esc(k) + '" style="margin-top:10px">' + (isOpen(k) ? "Show less" : "Show all " + fmtN(total)) + "</button>" : "";
  const plural = (n, one, many) => fmtN(n) + " " + (n === 1 ? one : many);

  // Sortable tables: rows are arrays of cells { h: html, s: sort value }; sorting happens on the data,
  // before "Show more" limits, so the whole list is sorted and not only what is on screen.
  const cell = (h, s) => ({ h: h, s: s === undefined ? h : s });
  // m(row) describes the mobile layout of a row: { rank, title, sub: [html…], tag, value, unit }.
  // Phones get that two-line list instead of the wide table, so nothing scrolls sideways.
  // bar: filter chips shown above the list; on phones the sort chip joins the same row
  function table(id, cols, rows, limit, m, bar) {
    const st = state.sorts[id];
    if (st) rows = rows.slice().sort((a, b) => {
      const x = a[st.col].s, y = b[st.col].s;
      const r = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "en", { sensitivity: "base" });
      return st.dir * r;
    });
    const shown = limit ? rows.slice(0, limit) : rows;
    SORT_LABELS[id] = cols.map((c) => c.label);
    // lists inside an artist, venue or song page keep their order: no sort chip on phones (João, 2026-10-29)
    const fixed = ["artist-concerts", "venue-concerts", "song-plays"].includes(id);
    const sortChips = m && !fixed ? '<span class="mchip">' + qpick("ms-" + id, "Sort", [["", "Default"]].concat(cols.map((c, i) => c.label === "#" ? null : [String(i), c.label, ' data-num="' + (c.num ? 1 : 0) + '"']).filter(Boolean)),
      st ? String(st.col) : "", "", ' data-sortsel="' + id + '"') +
      (st ? '<button type="button" class="toggle on icon-chip" data-sortdir="' + id + '" aria-label="' + (st.dir > 0 ? "Ascending, switch to descending" : "Descending, switch to ascending") + '">' + (st.dir > 0 ? "↑" : "↓") + "</button>" : "") + "</span>" : "";
    let sortBar = bar ? '<div class="quick">' + bar + sortChips + "</div>" : sortChips ? '<div class="quick msort">' + sortChips + "</div>" : "";
    // in the panel the direction is a two-way switch under the sort row, instead of the arrow chip
    const dirSeg = st ? '<div class="seg fs-dir" role="group" aria-label="Order">' + [[1, "Ascending"], [-1, "Descending"]].map(([v, l]) => '<button type="button" class="' + (st.dir === v ? "on" : "") + '"' + (st.dir === v ? "" : ' data-sortdir="' + id + '"') + ' aria-pressed="' + (st.dir === v) + '">' + l + "</button>").join("") + "</div>" : "";
    if (SHEETS[id] && (bar || m)) sortBar = fsSheet((bar || "") + sortChips + dirSeg, "Show " + plural(rows.length, SHEETS[id], SHEETS[id] + "s"), bar ? "" : "Sort", bar ? "" : "msort", (bar || "").includes("clear-all") || st ? id : "", SUB_SHEETS.includes(id) ? id : "main");
    // a filtered list that ends up empty says so and offers the way back
    if (bar && !rows.length) return sortBar + '<div class="empty empty-filters"><p>Nothing matches these filters.</p><button type="button" class="toggle on" data-clear="' + id + '">Clear filters</button></div>';
    const mlist = m ? '<ul class="mlist">' + shown.map((r) => {
      // links in the second line are spans: Safari keeps a button as one block, so a long name broke the line apart
      const x = m(r), sub = (x.sub || []).filter(Boolean).map((h) => h.replace(/<button type="button"/g, '<span role="button" tabindex="0"').replace(/<\/button>/g, "</span>"));
      return '<li>' + (x.rank !== undefined ? '<span class="m-rank">' + x.rank + "</span>" : "") +
        '<div class="m-main"><div class="m-title">' + x.title + "</div>" +
        (sub.length ? '<div class="m-sub">' + sub.join(" · ") + "</div>" : "") + (x.tag ? '<div class="m-tag">' + x.tag + "</div>" : "") + "</div>" +
        (x.value ? '<span class="m-val">' + x.value + (x.unit ? "<small>" + x.unit + "</small>" : "") + "</span>" : "") + "</li>";
    }).join("") + "</ul>" : "";
    return sortBar + mlist + '<div class="table-box' + (m ? " has-mlist" : "") + '"><table><thead><tr>' + cols.map((c, i) => {
      const on = st && st.col === i;
      return '<th scope="col"' + (c.num ? ' class="num"' : "") + (on ? ' aria-sort="' + (st.dir > 0 ? "ascending" : "descending") + '"' : "") +
        ">" + (fixed ? c.label : '<button type="button" class="th-btn" data-sort="' + id + "|" + i + "|" + (c.num ? 1 : 0) + '">' + c.label +
        '<span class="arrow" aria-hidden="true">' + (on ? (st.dir > 0 ? "↑" : "↓") : "↕") + "</span></button>") + "</th>";
    }).join("") + "</tr></thead><tbody>" +
      shown.map((r) => "<tr>" + r.map((c, i) => "<td" + (cols[i].cls ? ' class="' + cols[i].cls + '"' : "") + ">" + c.h + "</td>").join("") + "</tr>").join("") +
      "</tbody></table></div>" +
      (limit && rows.length > limit ? '<div class="more"><button class="btn" data-more="' + id + '" data-shown="' + limit + '">Show more</button></div>' : "");
  }
  // fresh: optional set of concerts to mark as "First time" in the notes

        (reunion ? fun("Longest wait to return", esc(reunion.artist), Math.floor(reunion.days / 365.25) + " years · " + reunion.from.slice(0, 4) + " to " + reunion.to.slice(0, 4), aattr(reunion.artist)) : "") +
      "</div></section>" +
      milestones() + about();
  }

  function about() {
    const first = chrono[0].date.slice(0, 4);
    return '<section class="card about" id="about" aria-labelledby="h-about">' +
      '<img src="img/me.jpg?v=__BUILD__" alt="João Miguel" width="96" height="96">' +
      '<div><h2 id="h-about">About me</h2>' +
      "<p>Hi, I'm João Miguel. I've been going to concerts since " + first + ", " + fmtN(chrono.length) + " so far, from tiny clubs to muddy festival fields. " +
      artistBtn("Pearl Jam", "text-link") + " is the reason this archive is called Long Road. When I'm not at a show, I'm probably at home spinning records.</p>" +
      '<a class="btn" href="https://www.discogs.com/user/ojoaomiguel" target="_blank" rel="noopener">' +
      VINYL(22) +
      "My record collection on Discogs</a></div></section>";
  }

  // ---------- concerts ----------
  function matches(c, q) {
    return [c.artist, c.venue, c.venueThen, c.city, c.country, c.tour, c.festival, c.date].some((f) => f && f.toLowerCase().includes(q));
  }

  function concertList() {
    if (state.detail) return concertDetail(state.detail);
    const q = state.q.trim().toLowerCase();
    const F = state.filter && FILTERS[state.filter.f];
    let list = F ? concerts.filter((c) => F.test(c, state.filter.v) && (!state.filter.y || c.date.startsWith(state.filter.y))) : concerts;
    if (q) list = list.filter((c) => matches(c, q));
    // quick filters on top of any other filter: festival or not, country and year.
    // Each one offers only what the others leave, with those counts.
    const base = list;
    const okKind = (c, k) => !k || (k === "fest" ? !!c.festival : !c.festival);
    const okCountry = (c) => !state.country || c.country === state.country;
    const okYear = (c) => !state.cYear || c.date.startsWith(state.cYear);
    list = base.filter((c) => okKind(c, state.kind) && okCountry(c) && okYear(c));
    const forKind = base.filter((c) => okCountry(c) && okYear(c));
    const kindBtn = (k, label) => { const none = k && !forKind.some((c) => okKind(c, k));
      return '<button type="button" class="' + (state.kind === k ? "on" : "") + '" data-kind="' + k + '" aria-pressed="' + (state.kind === k) + '"' + (none && state.kind !== k ? " disabled" : "") + ">" + label + "</button>"; };
    // the list's own filter (an artist, a venue…) sits with the other filters: first in the row on wide screens, first chip on phones
    const fChip = F ? '<span class="chip"><span class="chip-label">' + F.label + "</span><strong>" + esc(F.show(state.filter.v)) + (state.filter.y ? " · " + esc(state.filter.y) : "") + '</strong><button type="button" data-clearf="1" aria-label="Clear filter"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span>' : "";
    const quick = fChip + '<div class="seg" role="group" aria-label="Type">' + kindBtn("", "All") + kindBtn("shows", "Shows") + kindBtn("fest", "Festivals") + "</div>" +
      qpick("csel", "Country", facet(base.filter((c) => okKind(c, state.kind) && okYear(c)), (c) => c.country, state.country, "All countries"), state.country) +
      qpick("cysel", "Year", facet(base.filter((c) => okKind(c, state.kind) && okCountry(c)), (c) => c.date.slice(0, 4), state.cYear, "All years", true), state.cYear) +
      clearAll(state.kind || state.country || state.cYear || state.q || state.filter, "concerts");
    const cChips = [state.kind ? [state.kind === "fest" ? "Festivals" : "Shows", "kind"] : null, state.country ? [state.country, "country"] : null, state.cYear ? [state.cYear, "cYear"] : null].filter(Boolean);
    return '' +
      '<div class="list-head"><div class="list-title"><h2>' + plural(list.length, "concert", "concerts") + "</h2>" +
      "</div>" + searchBox("q", "Search concerts", "Search artist, venue, city", state.q, fsBtn(fsCount("concerts", cChips.length))) + withChip(fsChips("concerts", cChips), fChip) + "</div>" +
      table("concerts", CONCERT_COLS, concertRows(list), limitOf("concerts", 100), concertM, quick);
  }

  function concertDetail(id) {
    const c = concerts.find((x) => x.id === id);
    if (!c) return "";
    const groups = [];
    for (const s of c.songs || []) {
      let g = groups[groups.length - 1];
      if (!g || g.set !== s.set) { g = { set: s.set, songs: [] }; groups.push(g); }
      g.songs.push(s);
    }
    const idx = chronoIdx.get(c.id), prev = chrono[idx - 1], next = chrono[idx + 1];
    const d = new Date(c.date + "T12:00:00");
    // a span, not a button: Safari keeps buttons as one block, so a long festival name broke the line apart
    const link = (label, attr) => '<span role="button" tabindex="0" class="inline-link"' + attr + ">" + label + "</span>";
    // header meta: festival / venue / city, each opening the filtered list
    const meta = [
      c.festival ? link(esc(c.festival), fesattr(c.festival)) : null,
      (c.festival ? esc(c.venue) : link(esc(c.venue), vattr(venueKey(c)))) + (c.venueThen ? ' <span class="tag">(' + esc(c.venueThen) + ")</span>" : ""),
      link(esc(c.city), fattr("city", c.city))
    ].filter(Boolean).join(" · ");
    // context facts
    const withArtist = chrono.filter((x) => x.artist === c.artist);
    const nth = withArtist.findIndex((x) => x.id === c.id) + 1;
    const nights = new Set(chrono.filter((x, i) => i <= idx && x.venue === c.venue && x.city === c.city).map((x) => x.date)).size;
    const facts = ['<span class="fact">Concert #' + fmtN(idx + 1) + " of " + fmtN(chrono.length) + "</span>",
      '<span class="fact">' + (c.festival ? "Your " + ordinal(nights) + " day at " + esc(c.venue) : "Your " + ordinal(nights) + " night at " + esc(c.venue)) + "</span>"];
    if (c.stage && !/^region of /i.test(c.stage)) facts.push('<span class="fact">' + esc(/palco|stage|tent|clubbing/i.test(c.stage) ? c.stage : c.stage + " stage") + "</span>");
    if (c.tour) facts.push('<span class="fact">' + esc(c.tour) + "</span>");
    const others = withArtist.filter((x) => x.id !== c.id);
    // every time with this artist; day and month make same-year nights tell apart ("12 Jun '18")
    const hday = (x) => fmtDate(x.date).slice(0, 6).replace(/^0/, "") + " ’" + x.date.slice(2, 4);
    const history = '<section class="card"><h2>' + (others.length ? ordinal(nth) + " time seeing " + esc(c.artist) : "First time seeing " + esc(c.artist)) + "</h2>" +
      (others.length ? '<div class="history-list">' + withArtist.map((x) => x.id === c.id ? '<span class="hist cur">' + hday(x) + "</span>" :
        '<button type="button" class="hist"' + ' data-open="' + esc(x.id) + '" title="' + esc(fmtDate(x.date) + " · " + (x.festival || x.venue)) + '">' + hday(x) + "</button>").join("") + "</div>" : '<p class="muted" style="margin:0">The only time so far.</p>') + "</section>";
    // setlist
    const played = (c.songs || []).filter((x) => !x.tape && x.name);
    const isNew = (x) => !x.tape && x.name && firstHeard.get(songKey(x, c)) === c.id;
    const newCount = played.filter(isNew).length, coverCount = played.filter((x) => x.cover).length;
    const encores = groups.filter((g) => /^Encore/.test(g.set)).length;
    const summary = [plural(played.length, "song", "songs"), encores ? plural(encores, "encore", "encores") : "", coverCount ? plural(coverCount, "cover", "covers") : "", newCount && nth > 1 ? newCount + " new for you" : ""].filter(Boolean).join(" · ");
    // tapes (intro/outro music) get no number and are not counted
    let num = 0;
    const setlist = groups.length ?
      '<section class="card"><div class="card-head"><h2>Setlist</h2><span class="muted">' + summary + "</span></div>" +
      groups.map((g, i) => '<div><div class="set-label' + (/^Encore/.test(g.set) ? " encore" : "") + '">' + esc(g.set) + '</div><ol class="setlist">' +
        g.songs.map((x) => (x.tape ? '<li class="tape" title="Tape"><span class="n" aria-hidden="true"></span>' : '<li><span class="n">' + (++num) + ".</span>") + "<span>" + (x.tape ? esc(x.name) : '<span role="button" tabindex="0" class="inline-link"' + sattr(songKey(x, c)) + ">" + esc(x.name) + "</span>") +
          (nth > 1 && isNew(x) ? ' <span class="badge">new for you</span>' : "") +
          (x.cover ? ' <span class="badge cover">' + esc(x.cover) + (x.tape ? " song" : " cover") + "</span>" : "") +
          (x.with ? ' <span class="tag">· with ' + esc(x.with) + "</span>" : "") +
          (x.tape ? ' <span class="sr-only">(tape)</span>' : "") + (x.info ? ' <span class="tag">· ' + esc(x.info) + "</span>" : "") + "</span></li>").join("") + "</ol></div>").join("") +
      (c.info ? '<p class="muted" style="margin:14px 0 0">' + esc(c.info) + "</p>" : "") +
      '<a class="tag setlist-src" href="' + esc(c.url) + '" target="_blank" rel="noopener">Open on setlist.fm</a>' +
      "</section>"
      : c.extra ? '<p class="tag" style="margin:0">Not on setlist.fm: ' + esc(c.reason || "the artist is not in its database.") + (c.note ? " " + esc(c.note) : "") + (c.source ? ' <a href="' + esc(c.source) + '" target="_blank" rel="noopener">Source</a>' : "") + "</p>"
      : '<p class="tag" style="margin:0">No setlist yet. <a href="' + esc(c.url) + '" target="_blank" rel="noopener">Add it on setlist.fm</a></p>';
    // same night
    const sameNight = chrono.filter((x) => x.date === c.date && x.id !== c.id);
    const night = sameNight.length ? '<section class="card"><h2>Also that night</h2><div class="history-list">' + sameNight.map((x) =>
      '<button type="button" class="hist" data-open="' + esc(x.id) + '">' + esc(x.artist) + ((x.festival || x.venue) !== (c.festival || c.venue) ? " · " + esc(x.festival || x.venue) : "") + "</button>").join("") + "</div></section>" : "";
    const navBtn = (x, dir) => x ? '<button type="button" class="icon-btn" data-swap="' + esc(x.id) + '" aria-label="' + (dir < 0 ? "Previous" : "Next") + " concert: " + esc(x.artist) + '" title="' + esc(x.artist + " · " + fmtDate(x.date)) + '">' + (dir < 0 ? "‹" : "›") + "</button>" : '<span class="icon-btn off" aria-hidden="true">' + (dir < 0 ? "‹" : "›") + "</span>";
    // same skeleton as the other detail pages: back button, big title, then cards
    return '<article class="detail-wide detail">' +
      '<div class="detail-top"><button class="btn" id="back">← Back</button><div class="detail-nav"><button type="button" class="icon-btn" data-share-concert="' + esc(c.id) + '" aria-label="Share this concert as an image" title="Share as image">' +
        SHARE_ICON + '</button>' + navBtn(prev, -1) + navBtn(next, 1) + "</div></div>" +
      '<div class="detail-head"><span class="next-date big"><span class="m">' + mon(d) + '</span><span class="d">' + d.getDate() + '</span><span class="y">' + d.getFullYear() + "</span></span>" +
        '<div style="min-width:0"><h2 class="detail-title">' + artistBtn(c.artist, "title-link") + '</h2><div class="muted detail-meta">' + meta + "</div></div></div>" +
      '<div class="facts">' + facts.join("") + "</div>" +
      history + night +
      (groups.length ? setlist : '<section class="card"><h2>Setlist</h2>' + setlist + (c.info ? '<p class="muted" style="margin:14px 0 0">' + esc(c.info) + "</p>" : "") + "</section>") +
      "</article>";
  }
  const ordinal = (n) => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");

  // ---------- artists ----------
  function artistList() {
    if (state.artist) return artistPage(state.artist);
    const q = state.artistQ.trim().toLowerCase();
    const list = artists.filter((a) => (!q || a.key.toLowerCase().includes(q)) && (!state.shelfOnly || onShelf(a.key)) && (state.artistSet !== "homeAway" || homeAwaySet.has(a.key)));
    const mark = (k) => onShelf(k) ? ' <span class="on-shelf" title="On my record shelf">' + VINYL(14) + "</span>" : "";
    const rows = list.map((a) => { const s = artistSpan(a.key); return [
      cell(String(a.rank), a.rank), cell(artistBtn(a.key) + mark(a.key), a.key), cell(String(a.count), a.count),
      cell(fmtDate(s.first), s.first), cell(fmtDate(s.last), s.last)]; });
    const toggle = shelf.size ? '<button type="button" class="toggle' + (state.shelfOnly ? " on" : "") + '" data-shelf="' + (state.shelfOnly ? "0" : "1") + '" aria-pressed="' + !!state.shelfOnly + '">' + VINYL(14) + " On my shelf</button>" : "";
    const clearA = clearAll(state.shelfOnly || state.artistQ || state.artistSet, "artists");
    const setChip = state.artistSet === "homeAway" ? '<button type="button" class="toggle on" data-aset="" aria-label="Show all artists">Seen in Portugal and abroad ×</button>' : "";
    const aChips = state.shelfOnly ? [["On my shelf", "shelfOnly"]] : [];
    return '<div class="list-head"><div class="list-title"><h2>' + plural(list.length, "artist", "artists") + "</h2>" + setChip + "</div>" + searchBox("aq", "Search artist", "Search artist", state.artistQ, fsBtn(fsCount("artists", aChips.length))) + fsChips("artists", aChips) + "</div>" +
      table("artists", [{ label: "#", num: true, cls: "num" }, { label: "Artist" }, { label: "Concerts", num: true, cls: "num" }, { label: "First seen", cls: "muted date" }, { label: "Last seen", cls: "muted date" }], rows, limitOf("artists", 100),
        (r) => ({ rank: r[0].h, title: r[1].h, sub: [r[3].s.slice(0, 4) === r[4].s.slice(0, 4) ? r[3].s.slice(0, 4) : r[3].s.slice(0, 4) + " – " + r[4].s.slice(0, 4)], value: r[2].h, unit: r[2].s === 1 ? "concert" : "concerts" }), toggle + clearA);
  }

  // records by this artist in the Discogs collection
  function shelfCard(name) {
    const recs = onShelf(name);
    if (!recs) return "";
    const list = recs.slice().sort((a, b) => (a.year || 9999) - (b.year || 9999));
    return '<section class="card"><div class="card-head"><h2>On my shelf</h2><a class="link" href="https://www.discogs.com/user/' + esc(DISCOGS.user) + '/collection" target="_blank" rel="noopener">Discogs</a></div>' +
      '<ul class="records">' + list.map((r) => '<li><a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + VINYL(18) + '<span><span class="r-title">' + esc(r.title) + '</span><span class="muted">' + [r.year, r.format.split(", ").filter((f) => f !== "All Media").join(", ")].filter(Boolean).map(esc).join(" · ") + "</span></span></a></li>").join("") + "</ul></section>";
  }

  // side projects and solo careers shown on each other's page
  const RELATED = { "Pearl Jam": ["Eddie Vedder", "Temple of the Dog"], "Eddie Vedder": ["Pearl Jam"] };
  function artistPage(name) {
    const a = artists.find((x) => x.key === name);
    if (!a) return "";
    const list = concerts.filter((c) => c.artist === name);
    const first = list[list.length - 1], last = list[0];
    const aSongs = songsOnStage.filter((s) => s.artist === name);
    const heard = aSongs.reduce((n, s) => n + s.count, 0);
    const once = aSongs.filter((s) => s.count === 1);
    const aCovers = covers.filter((x) => x.artist === name);
    const aCountries = new Set(list.map((c) => c.country)).size;
    const aFest = list.filter((c) => c.festival).length;
    const top = withRank(aSongs.map((s) => ({ ...s })));
    // deeper song stats once there are a few setlists to compare
    const withSets = list.filter((c) => (c.songs || []).some((s) => !s.tape && s.name)).reverse();
    const ends = (pick) => withRank(countBy(withSets, (c) => { const p = c.songs.filter((s) => !s.tape && s.name); return pick(p).name; }));
    const songStats = withSets.length >= 3 ? (() => {
      const every = aSongs.filter((s) => s.count >= withSets.length);
      const biggest = withSets.reduce((b, c) => (c.songs.filter((s) => !s.tape && s.name).length > b.n ? { c, n: c.songs.filter((s) => !s.tape && s.name).length } : b), { c: null, n: 0 });
      const aDebuts = debuts.filter((d) => d.artist === name);
      // songs heard at least twice before that were missing from the latest setlist
      const lastSet = new Set(withSets[withSets.length - 1].songs.filter((s) => !s.tape && s.name).map((s) => s.name));
      const dropped = countBy(withSets.slice(0, -1).flatMap((c) => [...new Set(c.songs.filter((s) => !s.tape && s.name).map((s) => s.name))]), (n) => n).filter((s) => s.count > 1 && !lastSet.has(s.key));
      const chips = (l) => '<div class="history-list">' + l.map((x) => '<span class="hist">' + esc(x.key) + (x.count > 1 ? " ×" + x.count : "") + "</span>").join("") + "</div>";
      return '<section class="card"><h2>Openers and closers</h2>' +
          '<div class="kpi-label">Opened with</div>' + chips(ends((p) => p[0]).slice(0, 8)) +
          '<div class="kpi-label" style="margin-top:12px">Closed with</div>' + chips(ends((p) => p[p.length - 1]).slice(0, 8)) + "</section>" +
        '<section class="card"><h2>Setlist facts</h2><ul class="facts-list">' +
          "<li>" + (every.length ? "Heard at every show with a setlist (" + withSets.length + "): " + every.map((s) => esc(s.name)).join(" · ") : "No song made it into all " + withSets.length + " setlists") + "</li>" +
          '<li>Longest night: <button type="button" class="text-link" data-open="' + esc(biggest.c.id) + '">' + biggest.n + " songs, " + fmtDate(biggest.c.date) + "</button> at " + esc(biggest.c.festival || biggest.c.venue) + "</li>" +
          (dropped.length ? "<li>Not played at your last show (" + withSets[withSets.length - 1].date.slice(0, 4) + "): " + dropped.slice(0, 10).map((s) => esc(s.key) + " ×" + s.count).join(" · ") + "</li>" : "") +
          (aDebuts.length ? "<li>Live debuts you saw: " + aDebuts.map((d) => esc(d.name) + " (" + d.date.slice(0, 4) + ")").join(" · ") + "</li>" : "") +
        "</ul></section>";
    })() : "";
    // only the years he saw them
    const aYears = countBy(list, (c) => c.date.slice(0, 4)).sort((a, b) => a.key.localeCompare(b.key));
    const timeline = aYears.length > 1 ? '<section class="card"><h2>Years</h2><div class="history-list">' +
      aYears.map((y) => '<button type="button" class="hist"' + fattr("artist", name, y.key) + ">" + y.key + (y.count > 1 ? " ×" + y.count : "") + "</button>").join("") + "</div></section>" : "";
    const related = (RELATED[name] || []).map((r) => artists.find((x) => x.key === r)).filter(Boolean);
    return '<div class="detail-wide">' +
      '<button class="btn" id="backArtists">← All artists</button>' +
      '<div><div class="eyebrow">#' + a.rank + " most seen artist</div>" +
      '<h2 class="detail-title">' + esc(name) + "</h2>" +
      '<div class="muted detail-meta">First seen ' + fmtDate(first.date) + " at " + esc(first.festival || first.venue) + (list.length > 1 ? " · Last seen " + fmtDate(last.date) + " at " + esc(last.festival || last.venue) : "") + "</div></div>" +
      '<section class="grid kpis" aria-label="Artist summary">' +
        kpi("Concerts", '<span class="accent">' + a.count + "</span>", aFest ? aFest + " at festivals" : "", fattr("artist", name)) +
        kpi("Songs heard", fmtN(heard), fmtN(aSongs.length) + " different") +
        kpi("Years", (+last.date.slice(0, 4) - +first.date.slice(0, 4) + 1) + "", first.date.slice(0, 4) + "–" + last.date.slice(0, 4)) +
        kpi("Countries", aCountries + "") +
      "</section>" +
      (top.length ? '<section class="card"><h2>Songs you heard most</h2>' + bars(top.slice(0, isOpen("songs-" + name) ? top.length : 10), (s) => esc(s.name), (s) => sattr(s.key)) + moreBtn("songs-" + name, top.length, 10) + "</section>" : "") +
      (related.length ? '<section class="card"><h2>Also seen</h2><div class="history-list">' + related.map((x) => '<button type="button" class="hist"' + aattr(x.key) + ">" + esc(x.key) + " · " + plural(x.count, "concert", "concerts") + "</button>").join("") + "</div></section>" : "") +
      timeline + songStats +
      '<section class="card"><div class="card-head"><h2>Concerts</h2><button class="link"' + fattr("artist", name) + ">Open in concert list</button></div>" +
        table("artist-concerts", CONCERT_COLS, concertRows(list), 0, artistConcertM) + "</section>" +
      (once.length ? '<section class="card"><h2>Heard only once</h2><p class="muted" style="margin:0">' + once.map((s) => esc(s.name)).join(" · ") + "</p></section>" : "") +
      (aCovers.length ? '<section class="card"><h2>Covers</h2><p class="muted" style="margin:0">' + aCovers.map((x) => esc(x.name) + " (" + esc(x.original) + ")" + (x.count > 1 ? " ×" + x.count : "")).join(" · ") + "</p></section>" : "") +
      shelfCard(name) +
      "</div>";
  }

  // ---------- venues, festivals, songs ----------
  const vattr = (key) => ' data-venue="' + esc(key) + '"';
  function venuePage(key) {
    const v = venues.find((x) => x.key === key);
    if (!v) return "";
    const list = concerts.filter((c) => !c.festival && venueKey(c) === key);
    const first = list[list.length - 1], last = list[0];
    const vArtists = countBy(list, (c) => c.artist);
    const regulars = withRank(vArtists.filter((a) => a.count > 1));
    const vYears = countBy(list, (c) => c.date.slice(0, 4)).sort((a, b) => a.key.localeCompare(b.key));
    const nights = countBy(list, (c) => c.date);
    const busiest = nights[0];
    // artists João saw for the very first time at this venue
    const firsts = list.filter((c) => firstSeen.get(c.artist) === c.date && concerts.find((x) => x.artist === c.artist && x.date === c.date) === c);
    const songsHere = list.reduce((n, c) => n + (c.songs || []).filter((s) => !s.tape && s.name).length, 0);
    const span = +last.date.slice(0, 4) - +first.date.slice(0, 4) + 1;
    const at = (c) => '<span role="button" tabindex="0" class="inline-link"' + openAttr(c) + ">" + esc(c.artist) + "</span>";
    const facts = [
      busiest && busiest.count > 1 ? "Busiest night: " + plural(busiest.count, "concert", "concerts") + " on " + fmtDate(busiest.key) : "",
      list.length > 1 ? "Longest gap: " + (() => { let g = { d: 0 }; for (let i = 1; i < list.length; i++) { const d = Math.round((Date.parse(list[i - 1].date) - Date.parse(list[i].date)) / DAY); if (d > g.d) g = { d, from: list[i].date, to: list[i - 1].date }; } return g.d >= 365 ? (g.d / 365.25).toFixed(1) + " years" : g.d + " days"; })() + " without coming back" : "",
    ].filter(Boolean);
    return '<div class="detail-wide">' +
      '<button class="btn" id="backVenues">← All venues</button>' +
      '<div><div class="eyebrow">#' + v.rank + " most visited venue</div>" +
      '<h2 class="detail-title">' + esc(v.name) + "</h2>" +
      '<div class="muted detail-meta">' + esc([v.city, first.country].filter(Boolean).join(", ")) + " · First concert " + fmtDate(first.date) + " (" + at(first) + ")" +
        (list.length > 1 ? " · Last " + fmtDate(last.date) + " (" + at(last) + ")" : "") + "</div></div>" +
      '<section class="grid kpis" aria-label="Venue summary">' +
        kpi("Concerts", '<span class="accent">' + list.length + "</span>", nights.length < list.length ? plural(nights.length, "night", "nights") : "", fattr("venue", key)) +
        kpi("Artists", vArtists.length + "", firsts.length ? (firsts.length === vArtists.length ? "all first times" : plural(firsts.length, "first time", "first times")) : "") +
        kpi("Years", span + "", first.date.slice(0, 4) + (span > 1 ? "–" + last.date.slice(0, 4) : "")) +
        (songsHere ? kpi("Songs heard", fmtN(songsHere)) : "") +
      "</section>" +
      (regulars.length ? '<section class="card"><h2>Most seen here</h2>' + bars(regulars.slice(0, 10), (a) => esc(a.key), (a) => aattr(a.key)) + "</section>" : "") +
      (vYears.length > 1 ? '<section class="card"><h2>By year</h2><div class="history-list">' + vYears.map((y) => '<button type="button" class="hist"' + fattr("venue", key, y.key) + ">" + y.key + (y.count > 1 ? " ×" + y.count : "") + "</button>").join("") + "</div></section>" : "") +
      (facts.length ? '<section class="card"><h2>Venue facts</h2><ul class="facts-list">' + facts.map((f) => "<li>" + f + "</li>").join("") + "</ul></section>" : "") +
      '<section class="card"><div class="card-head"><h2>Concerts</h2><button class="link"' + fattr("venue", key) + ">Open in concert list</button></div>" +
        table("venue-concerts", VENUE_COLS.map((i) => CONCERT_COLS[i]), venueRows(concertRows(list, new Set(firsts))), 0, venueConcertM) + "</section>" +
      "</div>";
  }

  function venueList() {
    if (state.venue) return venuePage(state.venue);
    const firstVisit = (key) => { const l = concerts.filter((c) => !c.festival && venueKey(c) === key); return l[l.length - 1].date; };
    // country first, then the cities of that country
    const inCountry = venues.filter((v) => !state.venueCountry || v.country === state.venueCountry);
    const vq = plain(state.venueQ.trim());
    const list = inCountry.filter((v) => (!state.venueCity || v.city === state.venueCity) && (!vq || plain(v.name).includes(vq) || plain(v.city || "").includes(vq)));
    const vCities = countBy(inCountry, (v) => v.city);
    const rows = list.map((v) => { const f = firstVisit(v.key); return [cell(String(v.rank), v.rank), cell('<button class="open"' + vattr(v.key) + ">" + esc(v.name) + "</button>", v.name), cell(esc(v.city), v.city), cell(fmtDate(f), f), cell(String(v.count), v.count)]; });
    const vCountries = countBy(venues, (v) => v.country);
    const citySel = qpick("vcsel", "Country", [["", "All countries"]].concat(vCountries.map((x) => [x.key, x.key + " (" + x.count + ")"])), state.venueCountry) + qpick("vsel", "City", [["", "All cities"]].concat(vCities.map((x) => [x.key, x.key + " (" + x.count + ")"])), state.venueCity) + clearAll(state.venueCountry || state.venueCity || state.venueQ, "venues");
    const vChips = [state.venueCountry ? [state.venueCountry, "venueCountry"] : null, state.venueCity ? [state.venueCity, "venueCity"] : null].filter(Boolean);
    return '<div class="list-head"><div class="list-title"><h2>' + plural(list.length, "venue", "venues") + "</h2></div>" + searchBox("vq", "Search venue", "Search venue or city", state.venueQ, fsBtn(fsCount("venues", vChips.length))) + fsChips("venues", vChips) + "</div>" +
      table("venues", [{ label: "#", num: true, cls: "num" }, { label: "Venue" }, { label: "City", cls: "muted" }, { label: "First visit", cls: "muted date" }, { label: "Concerts", num: true, cls: "num" }], rows, 0,
        (r) => ({ rank: r[0].h, title: r[1].h, sub: [r[2].h, "since " + r[3].s.slice(0, 4)], value: r[4].h, unit: r[4].s === 1 ? "concert" : "concerts" }), citySel) +
      '<p class="tag list-note">Festival concerts are not counted here.</p>';
  }

  const fesattr = (name) => ' data-fest="' + esc(name) + '"';
  function festivalPage(name) {
    const f = festivals.find((x) => x.name === name);
    if (!f) return "";
    const list = concerts.filter((c) => c.festival === name);
    const first = list[list.length - 1], last = list[0];
    const fArtists = countBy(list, (c) => c.artist);
    const regulars = withRank(fArtists.filter((a) => a.count > 1));
    const firsts = list.filter((c) => firstSeen.get(c.artist) === c.date && concerts.find((x) => x.artist === c.artist && x.date === c.date) === c);
    const songsHere = list.reduce((n, c) => n + (c.songs || []).filter((s) => !s.tape && s.name).length, 0);
    const sites = countBy(list, (c) => c.venue).map((s) => s.key);
    const busiest = countBy(list, (c) => c.date)[0];
    // longest run of consecutive editions; 2020 and 2021 had no festivals (COVID), so skipping them does not break it
    const NO_FESTIVALS = [2020, 2021];
    const follows = (a, b) => { let y = a + 1; while (NO_FESTIVALS.includes(y) && y !== b) y++; return b === y; };
    const ys = f.years.map(Number).sort((a, b) => a - b);
    let run = { n: 1, from: ys[0], to: ys[0] }, cur = { ...run };
    for (let i = 1; i < ys.length; i++) { cur = follows(ys[i - 1], ys[i]) ? { n: cur.n + 1, from: cur.from, to: ys[i] } : { n: 1, from: ys[i], to: ys[i] }; if (cur.n > run.n) run = { ...cur }; }
    const covidGap = run.from < 2020 && run.to > 2021 && !NO_FESTIVALS.every((y) => ys.includes(y));
    // editions, newest first: dates, site and the artists seen, in the order they played
    const editions = f.years.slice().sort().reverse().map((y) => {
      const l = list.filter((c) => c.date.startsWith(y)).reverse();
      const a = l[0].date, b = l[l.length - 1].date;
      // the year is already the heading, so the dates leave it out
      const when = a === b ? fmtDate(a).slice(0, 6) : fmtDate(a).slice(0, a.slice(0, 7) === b.slice(0, 7) ? 2 : 6) + "–" + fmtDate(b).slice(0, 6);
      const where = [...new Set(l.map((c) => c.venue))].join(", ");
      const eNew = l.filter((c) => firstSeen.get(c.artist) === c.date).length;
      const eSongs = l.reduce((n, c) => n + (c.songs || []).filter((s) => !s.tape && s.name).length, 0);
      return '<div class="edition"><div class="edition-head"><button type="button" class="year-link"' + fattr("festival", name, y) + ">" + y + "</button>" +
        '<span class="edition-meta">' + when + " · " + esc(where) + "</span>" +
        '<span class="edition-stats">' + plural(l.length, "concert", "concerts") + (eNew ? ' · <span class="new-dot" aria-hidden="true"></span>' + eNew + " new to you" : "") + (eSongs ? " · " + fmtN(eSongs) + " songs" : "") + "</span></div>" +
        // one line per day, so the line-up reads like the festival poster
        [...new Set(l.map((c) => c.date))].map((d) => '<div class="fday"><span class="fday-date">' + weekdayOf(d).slice(0, 3) + " " + fmtDate(d).slice(0, 6) + "</span>" +
          '<div class="history-list">' + l.filter((c) => c.date === d).map((c) => { const fresh = firstSeen.get(c.artist) === c.date; return '<button type="button" class="hist' + (fresh ? ' fresh" title="First time you saw them"' : '"') + openAttr(c) + ">" + (fresh ? '<span class="new-dot" aria-hidden="true"></span>' : "") + esc(c.artist) + "</button>"; }).join("") + "</div></div>").join("") + "</div>";
    }).join("");
    const facts = [
      busiest && busiest.count > 1 ? "Busiest day: " + plural(busiest.count, "concert", "concerts") + " on " + fmtDate(busiest.key) : "",
      run.n > 1 ? "Longest streak: " + run.n + " editions in a row (" + run.from + "–" + run.to + (covidGap ? ", no festivals in 2020–21" : "") + ")" : "",
      sites.length > 1 ? "Sites: " + sites.map(esc).join(", ") : "",
    ].filter(Boolean);
    return '<div class="detail-wide">' +
      '<button class="btn" id="backFestivals">← All festivals</button>' +
      '<div><div class="eyebrow">#' + f.rank + " festival</div>" +
      '<h2 class="detail-title">' + esc(name) + "</h2>" +
      '<div class="muted detail-meta">' + esc([first.city, first.country].filter(Boolean).join(", ")) + " · First edition " + first.date.slice(0, 4) + (f.count > 1 ? " · Last " + last.date.slice(0, 4) : "") + "</div></div>" +
      '<section class="grid kpis" aria-label="Festival summary">' +
        kpi("Editions", '<span class="accent">' + f.count + "</span>", plural(f.days, "day", "days")) +
        kpi("Concerts", list.length + "", "", fattr("festival", name)) +
        kpi("Artists", fArtists.length + "", firsts.length ? (firsts.length === fArtists.length ? "all first times" : plural(firsts.length, "first time", "first times")) : "") +
        (songsHere ? kpi("Songs heard", fmtN(songsHere)) : "") +
      "</section>" +
      '<section class="card"><div class="card-head"><h2>Editions</h2><button class="link"' + fattr("festival", name) + ">Open in concert list</button></div>" + editions + "</section>" +
      (regulars.length ? '<section class="card"><h2>Most seen here</h2>' + bars(regulars.slice(0, 10), (a) => esc(a.key), (a) => aattr(a.key)) + "</section>" : "") +
      (facts.length ? '<section class="card"><h2>Festival facts</h2><ul class="facts-list">' + facts.map((x) => "<li>" + x + "</li>").join("") + "</ul></section>" : "") +
      "</div>";
  }

  function festivalList() {
    if (state.festival) return festivalPage(state.festival);
    const fq = plain(state.festQ.trim());
    const fl = festivals.filter((f) => (!state.festCountry || f.country === state.festCountry) && (!fq || plain(f.name).includes(fq)));
    const fCountries = countBy(festivals, (f) => f.country);
    const bar = qpick("fcsel", "Country", [["", "All countries"]].concat(fCountries.map((x) => [x.key, x.key + " (" + x.count + ")"])), state.festCountry) + clearAll(state.festCountry || state.festQ, "festivals");
    const fChips = state.festCountry ? [[state.festCountry, "festCountry"]] : [];
    const rows = fl.map((f) => [cell(String(f.rank), f.rank), cell('<button class="open"' + fesattr(f.name) + ">" + esc(f.name) + "</button>", f.name), cell(String(f.count), f.count), cell(String(f.concerts), f.concerts), cell(f.years.join(", "), f.years[0])]);
    fl.forEach((f, i) => { rows[i][4].h = festStrip(f); });
    return '<div class="list-head"><div class="list-title"><h2>' + plural(fl.length, "festival", "festivals") + "</h2></div>" + searchBox("fq", "Search festival", "Search festival", state.festQ, fsBtn(fsCount("festivals", fChips.length))) + fsChips("festivals", fChips) + "</div>" +
      table("festivals", [{ label: "#", num: true, cls: "num" }, { label: "Festival" }, { label: "Editions", num: true, cls: "num" }, { label: "Concerts", num: true, cls: "num" }, { label: "Years", cls: "muted" }], rows, 0,
        (r) => ({ rank: r[0].h, title: r[1].h, sub: [plural(r[2].s, "edition", "editions")], tag: r[4].h, value: r[3].h, unit: r[3].s === 1 ? "concert" : "concerts" }), bar) +
      '<p class="tag list-note">Each strip runs from ' + FS_FROM + " to " + FS_TO + "; bar height is concerts seen at that edition.</p>";
  }

  // one strip per festival, same scale for all: a bar for each edition attended, height = concerts seen there
  const festYear = countBy(concerts.filter((c) => c.festival), (c) => c.festival + "|" + c.date.slice(0, 4));
  const festYearN = new Map(festYear.map((x) => [x.key, x.count]));
  const FS_MAX = Math.max(1, ...festYear.map((x) => x.count));
  const FS_FROM = Math.min(...festivals.flatMap((f) => f.years.map(Number)));
  const FS_TO = Math.max(new Date().getFullYear(), ...festivals.flatMap((f) => f.years.map(Number)));
  function festStrip(f) {
    let h = "";
    for (let y = FS_FROM; y <= FS_TO; y++) {
      const n = festYearN.get(f.name + "|" + y);
      h += n ? '<button type="button" class="fs-y"' + fattr("festival", f.name, String(y)) + ' title="' + y + " · " + plural(n, "concert", "concerts") + '" aria-label="' + y + ": " + plural(n, "concert", "concerts") + '"><span style="height:' + Math.round(20 + Math.sqrt(n / FS_MAX) * 80) + '%"></span></button>'
        : '<span class="fs-y" aria-hidden="true"></span>';
    }
    return '<div class="fstrip" style="--n:' + (FS_TO - FS_FROM + 1) + '">' + h + "</div>";
  }

  const sattr = (key) => ' data-song="' + esc(key) + '"';
  // where a song falls in the setlist: one dot per time heard, from the first song (left) to the last (right)
  function setStrip(plays) {
    const pts = plays.filter((x) => x.n > 1);
    if (!pts.length) return "";
    const third = (x) => x.i / (x.n - 1) < 1 / 3 ? 0 : x.i / (x.n - 1) <= 2 / 3 ? 1 : 2;
    const parts = [0, 1, 2].map((k) => pts.filter((x) => third(x) === k).length);
    return '<section class="card"><h2>Where it falls in the set</h2>' +
      // ten slices of the setlist, from the first song to the last; encore plays stacked on top
      (() => {
        const bins = Array.from({ length: 10 }, () => ({ main: 0, enc: 0 }));
        pts.forEach((x) => { bins[Math.min(9, Math.floor(x.i / (x.n - 1) * 10))][/^Encore/.test(x.set || "") ? "enc" : "main"]++; });
        const top = Math.max(...bins.map((x) => x.main + x.enc));
        return '<div class="setstrip" role="img" aria-label="' + esc("Early " + parts[0] + ", middle " + parts[1] + ", late " + parts[2]) + '">' + bins.map((x) => {
          const n = x.main + x.enc;
          return '<div class="setstrip-col">' + (n ? '<span class="setstrip-n">' + n + "</span>" : "") +
            (x.enc ? '<span class="setstrip-bar enc" style="height:' + (x.enc / top * 100).toFixed(1) + '%"></span>' : "") +
            (x.main ? '<span class="setstrip-bar" style="height:' + (x.main / top * 100).toFixed(1) + '%"></span>' : "") + "</div>";
        }).join("") + "</div>";
      })() +
      '<div class="setstrip-axis"><span>Opener</span><span>Middle</span><span>Closer</span></div>' +
      '<div class="setstrip-legend muted">' + ["Early", "Middle", "Late"].map((l, k) => l + " <b>" + parts[k] + "</b>").join(" · ") +
        (pts.some((x) => /^Encore/.test(x.set || "")) ? ' · <span class="setstrip-key main"></span>main set · <span class="setstrip-key enc"></span>encore' : "") + "</div></section>";
  }
  // every time João heard one song, whoever played it, with where it fell in the setlist
  function songPage(key) {
    const s = songs.find((x) => x.key === key);
    if (!s) return "";
    const plays = [];
    for (const c of concerts) {
      const p = (c.songs || []).filter((x) => !x.tape && x.name);
      p.forEach((x, i) => { if (songKey(x, c) === key) plays.push({ c, i, n: p.length, set: x.set, info: x.info, with: x.with }); });
    }
    const first = plays[plays.length - 1], last = plays[0];
    const opened = plays.filter((x) => x.i === 0 && x.n > 2).length, closed = plays.filter((x) => x.i === x.n - 1 && x.n > 2).length;
    const encores = plays.filter((x) => /^Encore/.test(x.set || "")).length;
    const performers = countBy(plays, (x) => x.c.artist);
    const yrs = new Set(plays.map((x) => x.c.date.slice(0, 4))).size;
    const seenOwner = artists.some((a) => a.key === s.artist);
    const pos = (x) => x.n > 2 && x.i === 0 ? "Opener" : x.n > 2 && x.i === x.n - 1 ? "Closer" : "#" + (x.i + 1) + " of " + x.n;
    const rows = plays.map((x) => [
      cell('<span style="white-space:nowrap">' + fmtDate(x.c.date) + "</span>", x.c.date),
      cell('<button type="button" class="open" data-open="' + esc(x.c.id) + '">' + esc(x.c.artist) + "</button>", x.c.artist),
      cell(esc(x.c.festival || x.c.venue), x.c.festival || x.c.venue),
      cell(esc(pos(x)) + (/^Encore/.test(x.set || "") ? ' <span class="tag">· encore</span>' : "") + (x.with ? ' <span class="tag">· with ' + esc(x.with) + "</span>" : ""), x.i)]);
    const facts = [
      opened ? "Opened the show " + plural(opened, "time", "times") : "",
      closed ? "Closed the show " + plural(closed, "time", "times") : "",
      encores ? "Played in the encore " + plural(encores, "time", "times") : "",
      performers.length > 1 ? "Played by " + performers.map((a) => esc(a.key) + (a.count > 1 ? " ×" + a.count : "")).join(", ") : "",
    ].filter(Boolean);
    return '<div class="detail-wide">' +
      '<button class="btn" id="backSongs">← All songs</button>' +
      '<div><div class="eyebrow">' + (s.count > 1 ? "#" + s.rank + " most heard song" : "Heard once") + "</div>" +
      '<h2 class="detail-title">' + esc(s.name) + "</h2>" +
      '<div class="muted detail-meta">' + (seenOwner ? "by " + artistBtn(s.artist, "text-link") : esc(s.artist) + " cover") + "</div></div>" +
      '<section class="grid kpis" aria-label="Song summary">' +
        kpi("Times heard", '<span class="accent">' + s.count + "</span>", "", fattr("song", s.artist + "||" + s.name)) +
        kpi("First heard", fmtDate(first.c.date).slice(-4), esc(first.c.artist) + " · " + fmtDate(first.c.date).slice(0, 6), openAttr(first.c)) +
        kpi("Last heard", fmtDate(last.c.date).slice(-4), esc(last.c.artist) + " · " + fmtDate(last.c.date).slice(0, 6), openAttr(last.c)) +
        kpi("Years", yrs + "", "with this song live") +
      "</section>" +
      setStrip(plays) +
      (facts.length ? '<section class="card"><h2>Song facts</h2><ul class="facts-list">' + facts.map((f) => "<li>" + f + "</li>").join("") + "</ul></section>" : "") +
      '<section class="card"><div class="card-head"><h2>Every time you heard it</h2><button class="link"' + fattr("song", s.artist + "||" + s.name) + ">Open in concert list</button></div>" +
        table("song-plays", [{ label: "Date", cls: "muted date" }, { label: "Artist" }, { label: "Where", cls: "muted" }, { label: "In the setlist" }], rows, 0,
          (r) => ({ title: r[1].h, sub: [r[0].h, r[2].h], tag: r[3].h })) + "</section>" +
      "</div>";
  }

  function songList() {
    if (state.song) return songPage(state.song);
    const q = plain(state.songQ);
    // songs whose title matches come first, then songs by matching artists
    const pool = songs;
    const list = q ? pool.filter((s) => plain(s.name).includes(q)).concat(pool.filter((s) => !plain(s.name).includes(q) && [s.artist, ...s.by].some((a) => plain(a).includes(q)))) : pool;
    // an original by an artist João never saw is shown as a cover of whoever played it, so it does not look like he saw them
    const seen = (a) => artists.some((x) => x.key === a);
    const songArtist = (s) => seen(s.artist)
      ? artistBtn(s.artist, "open muted-btn") + (s.by.size ? ' <span class="tag">· also by ' + [...s.by].map(esc).join(", ") + "</span>" : "")
      : [...s.by].map((a) => artistBtn(a, "open muted-btn")).join(", ") + ' <span class="tag">· ' + esc(s.artist) + " cover</span>";
    const rows = list.map((s) => [cell(String(s.rank), s.rank), cell('<button type="button" class="open"' + sattr(s.key) + ">" + esc(s.name) + "</button>", s.name), cell(songArtist(s), seen(s.artist) ? s.artist : [...s.by][0]), cell(String(s.count), s.count)]);
    // the two lists below have their own search (João, 2026-10-29)
    const cq = plain(state.coverQ.trim()), dq = plain(state.debutQ.trim());
    const coverRows = covers.filter((x) => !cq || [x.name, x.original, x.artist].some((v) => plain(v).includes(cq))).map((x) => [cell(esc(x.name), x.name), cell(esc(x.original), x.original), cell(artistBtn(x.artist, "open muted-btn"), x.artist), cell(String(x.count), x.count)]);
    const debutRows = debuts.filter((d) => !dq || [d.name, d.artist].some((v) => plain(v).includes(dq))).slice().sort((a, b) => b.date.localeCompare(a.date)).map((d) => [cell('<button type="button" class="open muted-btn" data-open="' + esc(d.id) + '">' + fmtDate(d.date) + "</button>", d.date), cell(esc(d.name), d.name), cell(esc(d.artist), d.artist), cell(esc(d.info), d.info)]);
    return '<div class="list-head"><div class="list-title"><h2>Songs you heard most</h2><span class="muted">' + fmtN(songs.length) + " different songs, " + fmtN(songsHeard) + " in total, " + fmtN(heardOnce) + " heard only once</span>" + "</div>" + searchBox("sq", "Search songs", "Search song or artist", state.songQ, fsBtn(fsCount("songs", 0), "Sort")) + fsChips("songs", []) + "</div>" +
      (q && !list.length ? '<div class="empty">No songs match.</div>' : "") +
      table("songs", [{ label: "#", num: true, cls: "num" }, { label: "Song" }, { label: "Artist" }, { label: "Times", num: true, cls: "num" }], rows, limitOf("songs", 25),
        (r) => ({ rank: r[0].h, title: r[1].h, sub: [r[2].h], value: r[3].h, unit: r[3].s === 1 ? "time" : "times" })) +

        moreBtn("new-" + y, newArtists.length, 12) + "</section>" : "") +
      (yVenues.length ? '<section class="card"><h2>Venues</h2>' + bars(yVenues.slice(0, 10), (v) => esc(v.name) + ' <span class="muted">· ' + esc(v.city) + "</span>", (v) => ["venue", v.key, y]) + "</section>" : "") +
      (yFest.length ? '<section class="card"><h2>Festivals</h2>' + bars(yFest, (f) => esc(f.key), (f) => ["festival", f.key, y]) + "</section>" : "");
  }

  // a 1080×1920 image of the year (Instagram story size), to share on a phone or save on desktop;
  // Instagram covers roughly the top 150px and bottom 120px with its own buttons

    const list = concerts.filter((c) => c.date.startsWith(y));
    const yArtists = withRank(byPopularity(countBy(list, (c) => c.artist)));
    const firstEver = new Map();
    for (let i = concerts.length - 1; i >= 0; i--) if (!firstEver.has(concerts[i].artist)) firstEver.set(concerts[i].artist, concerts[i].date);
    const nNew = yArtists.filter((a) => firstEver.get(a.key).startsWith(y)).length;
    const nVenues = new Set(list.filter((c) => !c.festival).map(venueKey)).size;
    const nFest = new Set(list.map((c) => c.festival).filter(Boolean)).size;
    const nCities = new Set(list.map((c) => c.city)).size;
    const nCountries = new Set(list.map((c) => c.country)).size;
    const months = Array.from({ length: 12 }, (_, m) => list.filter((c) => +c.date.slice(5, 7) === m + 1).length);
    try { await document.fonts.ready; } catch (e) {}
    const W = 1080, H = 1920, X = 80, R = W - 80, cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const g = cv.getContext("2d");
    const { DISP, BODY, MONO, ACC, TXT, INK2, MUT, LINE } = await shareKit();
    const fit = (t, max) => { if (g.measureText(t).width <= max) return t; while (t.length > 1 && g.measureText(t + "…").width > max) t = t.slice(0, -1); return t + "…"; };
    // section labels as on the site: small spaced capitals under a thin rule
    const label = (t, yy) => { g.fillStyle = LINE; g.fillRect(X, yy - 52, R - X, 2); g.fillStyle = MUT; g.font = "500 24px " + BODY; g.letterSpacing = "4px"; g.fillText(t, X, yy); g.letterSpacing = "0px"; };
    shareBackground(g, W, H);
    // everything but the link sits 40px higher (João, 2026-10-25)
    g.save(); g.translate(0, -40);
    shareHeader(g, X, 236, "joão miguel's year in concerts", { DISP, BODY, ACC, TXT, INK2 });
    // the year, then the concert count
    g.fillStyle = ACC; g.font = "340 250px " + DISP; g.letterSpacing = "-7px"; g.fillText(y, X - 8, 540);
    g.fillStyle = TXT; g.font = "340 170px " + DISP; g.letterSpacing = "-5px"; g.fillText(fmtN(list.length), X - 6, 730); g.letterSpacing = "0px";
    const cw0 = g.measureText(fmtN(list.length)).width;
    g.fillStyle = INK2; g.font = "400 44px " + BODY; g.fillText(list.length === 1 ? "concert" : "concerts", X + cw0 + 18, 730);
    // numbers: two rows of three
    const kp = [[yArtists.length, "artists"], [nNew, "new artists"], [nVenues, nVenues === 1 ? "venue" : "venues"],
      [nFest, nFest === 1 ? "festival" : "festivals"], [nCities, nCities === 1 ? "city" : "cities"], [nCountries, nCountries === 1 ? "country" : "countries"]];
    g.fillStyle = LINE; g.fillRect(X, 790, R - X, 2);
    kp.forEach(([v, l], i) => {
      const cw = (R - X) / 3, x = X + (i % 3) * cw, top = 830 + Math.floor(i / 3) * 150;
      g.fillStyle = TXT; g.font = "340 84px " + DISP; g.letterSpacing = "-2px"; g.fillText(fmtN(v), x - 2, top + 72); g.letterSpacing = "0px";
      g.fillStyle = MUT; g.font = "400 26px " + MONO; g.fillText(l, x, top + 112);
    });
    // concerts per month
    label("MONTH BY MONTH", 1170);
    const mMax = Math.max(1, ...months), bw = (R - X) / 12, base = 1390;
    months.forEach((n, m) => {
      const h = n ? Math.max(6, 150 * n / mMax) : 3, x = X + m * bw + 6;
      g.fillStyle = n === mMax ? ACC : n ? "rgba(255,107,66,.45)" : LINE; g.fillRect(x, base - h, bw - 12, h);
      g.fillStyle = MUT; g.font = "400 23px " + MONO; g.textAlign = "center";
      g.fillText("JFMAMJJASOND"[m], x + (bw - 12) / 2, base + 36);
      if (n) { g.fillStyle = n === mMax ? TXT : MUT; g.fillText(String(n), x + (bw - 12) / 2, base - h - 10); }

    yArtists.slice(0, 5).forEach((a, i) => {
      const yy = 1552 + i * 56;
      g.fillStyle = a.rank === 1 ? ACC : MUT; g.font = "380 40px " + DISP; g.textAlign = "center"; g.fillText(String(a.rank), X + 14, yy); g.textAlign = "left";
      g.fillStyle = TXT; g.font = "500 36px " + BODY; g.fillText(fit(a.key, R - X - 160), X + 60, yy);
      g.fillStyle = MUT; g.font = "400 28px " + MONO; g.textAlign = "right"; g.fillText(a.count + "×", R, yy); g.textAlign = "left";
    });
    g.restore();
    g.fillStyle = MUT; g.font = "400 25px " + MONO; g.textAlign = "right"; g.fillText("longroad.joaomiguel.com", R, 1815); g.textAlign = "left";
    await deliverPng(cv, "long-road-" + y + ".png", "Long Road " + y);
  }

  // the share images follow the site's dark theme (sismos.pt look, 2026-10-29): canvas cannot read CSS variables, so the colours are spelled out
  async function shareKit() {
    try { await Promise.all(['340 100px "Fraunces Variable"', '400 20px "Hanken Grotesk"', '500 20px "Hanken Grotesk"', '400 20px "Geist Mono"'].map((f) => document.fonts.load(f))); } catch (e) {}
    return { DISP: '"Fraunces Variable", Georgia, serif', BODY: '"Hanken Grotesk", Arial, sans-serif', MONO: '"Geist Mono", Menlo, monospace',
      ACC: "#ff6b42", TXT: "#ece8df", INK2: "#b9b3a7", MUT: "#857f74", LINE: "#2e2c28" };
  }
  // dark paper with a light grain, as the site
  function shareBackground(g, W, H) {
    g.fillStyle = "#151412"; g.fillRect(0, 0, W, H);
    const img = g.getImageData(0, 0, W, H), px = img.data;
    for (let i = 0; i < px.length; i += 4) { const n = (Math.random() - .5) * 14; px[i] += n; px[i + 1] += n; px[i + 2] += n; }
    g.putImageData(img, 0, 0);
  }
  // "long road." with the coral dot, and a line under it, like the site header
  function shareHeader(g, X, y, sub, k) {
    g.textBaseline = "alphabetic";
    g.fillStyle = k.TXT; g.font = "420 54px " + k.DISP; g.letterSpacing = "-1px"; g.fillText("long road", X, y);
    const w = g.measureText("long road").width; g.fillStyle = k.ACC; g.fillText(".", X + w, y); g.letterSpacing = "0px";
    g.fillStyle = k.INK2; g.font = "400 28px " + k.BODY; g.fillText(sub, X, y + 46);
  }

  // phones get the share sheet (Instagram, WhatsApp…); computers download the PNG
  async function deliverPng(cv, name, title) {
    const blob = await new Promise((r) => cv.toBlob(r, "image/png"));
    const file = new File([blob], name, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && window.matchMedia("(pointer: coarse)").matches) {
      try { await navigator.share({ files: [file], title }); } catch (e) {}
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  // one concert as a story-sized image, in the same style as the year image
  async function shareConcert(id) {
    const c = concerts.find((x) => x.id === id);
    if (!c) return;
    const idx = chronoIdx.get(c.id);
    const withArtist = chrono.filter((x) => x.artist === c.artist);
    const nth = withArtist.findIndex((x) => x.id === c.id) + 1;
    const played = (c.songs || []).filter((x) => !x.tape && x.name);
    try { await document.fonts.ready; } catch (e) {}
    const W = 1080, H = 1920, X = 80, R = W - 80, cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const g = cv.getContext("2d");
    const { DISP, BODY, MONO, ACC, TXT, INK2, MUT, LINE } = await shareKit();
    const fit = (t, max) => { if (g.measureText(t).width <= max) return t; while (t.length > 1 && g.measureText(t + "…").width > max) t = t.slice(0, -1); return t + "…"; };
    // long names break over two lines, then shrink until they fit
    const wrap = (t, max) => {
      const lines = [""];
      for (const w of t.split(" ")) { const next = (lines[lines.length - 1] + " " + w).trim(); if (g.measureText(next).width <= max || !lines[lines.length - 1]) lines[lines.length - 1] = next; else lines.push(w); }
      return lines;
    };
    shareBackground(g, W, H);
    shareHeader(g, X, 196, "joão miguel's concert archive", { DISP, BODY, ACC, TXT, INK2 });
    // date, artist, where
    const d = new Date(c.date + "T12:00:00");
    g.fillStyle = ACC; g.font = "400 36px " + MONO; g.letterSpacing = "4px";
    g.fillText((d.getDate() + " " + mon(d) + " " + d.getFullYear()).toUpperCase(), X, 400); g.letterSpacing = "0px";
    let size = 150; g.font = "380 " + size + "px " + DISP;
    let lines = wrap(c.artist, R - X);
    while ((lines.length > 2 || lines.some((l) => g.measureText(l).width > R - X)) && size > 70) { size -= 10; g.font = "380 " + size + "px " + DISP; lines = wrap(c.artist, R - X); }
    let yy = 400 + size * 1.05;
    g.fillStyle = TXT;
    lines.slice(0, 2).forEach((l, i) => { if (i) yy += size * 1.02; g.fillText(fit(l, R - X), X - 4, yy); });
    yy += 80;
    g.font = "340 42px " + DISP;
    if (c.festival) { g.fillStyle = ACC; g.fillText(fit(c.festival, R - X), X, yy); yy += 56; }
    g.fillStyle = INK2; g.fillText(fit(c.venue + " · " + c.city + (c.country !== "Portugal" ? ", " + c.country : ""), R - X), X, yy); yy += 56;
    g.fillStyle = MUT; g.font = "400 26px " + MONO;
    g.fillText("concert #" + fmtN(idx + 1) + " · " + (nth > 1 ? ordinal(nth) + " time seeing them" : "first time seeing them"), X, yy);
    yy += 50;
    g.fillStyle = LINE; g.fillRect(X, yy, R - X, 2); yy += 70;
    // setlist: one column, or two when it is long; whatever does not fit is counted at the end
    g.fillStyle = MUT; g.font = "500 24px " + BODY; g.letterSpacing = "4px";
    g.fillText(played.length ? "SETLIST · " + played.length + (played.length === 1 ? " SONG" : " SONGS") : "SETLIST", X, yy); g.letterSpacing = "0px";
    yy += 30;
    if (!played.length) { g.fillStyle = MUT; g.font = "400 32px " + BODY; g.fillText("No setlist on setlist.fm yet.", X, yy + 40); }
    else {
      // every part of the show gets its label (Main set, Set 1, Encore…), unless it is all one main set
      const sets = [...new Set(played.map((x) => x.set))], encores = sets.filter((x) => /^Encore/.test(x)).length;
      const setName = (x) => x === "Main" ? "Main set" : /^Encore/.test(x) && encores === 1 ? "Encore" : x.replace(/:$/, "");
      const labels = sets.length > 1 || sets[0] !== "Main";
      const rows = [];
      let lastSet = null;
      for (const x of played) {
        if (labels && x.set !== lastSet) rows.push({ label: setName(x.set), encore: /^Encore/.test(x.set) });
        lastSet = x.set; rows.push({ name: x.name });
      }
      // one column while the rows fit at 40px or more, else two columns: the first one full, the rest in the second
      const top = yy + 20, bottom = 1760, space = bottom - top, cols = rows.length * 40 > space ? 2 : 1;
      const lh = cols > 1 ? 44 : Math.max(40, Math.min(52, Math.floor(space / rows.length))), maxCol = Math.floor(space / lh);
      const colW = (R - X) / cols, fs = lh >= 50 ? 34 : lh >= 44 ? 30 : 28;
