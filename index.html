<style>
  :root {
    --bg: #0F1115; --surface: #181B21; --line: #262A31; --line-2: #3A3F48;
    --text: #ECEDEE; --muted: #9AA0A6; --accent: #F2A541; --accent-2: #FFC876; --ok: #7BC67E; --bad: #F2726B;
    --display: Oswald, "Arial Narrow", sans-serif;
    --map-bg: #1b1d22; --on-accent: #0F1115;
  }
  /* light theme: same layout, paper colours; the amber is darker so text in it stays readable on white */
  :root[data-theme="light"] {
    --bg: #F6F4EF; --surface: #FFFFFF; --line: #E5E1D8; --line-2: #CFCAC0;
    --text: #1A1C20; --muted: #5E646C; --accent: #B0680C; --accent-2: #8F5308; --ok: #2E8540; --bad: #C9372C;
    --map-bg: #E9E6DF; --on-accent: #FFFFFF;
  }
  :root[data-theme="light"] header { background: linear-gradient(180deg, rgba(176,104,12,.08), rgba(176,104,12,0) 70%); }
  :root[data-theme="light"] .seg button.on { box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  /* the new tab slides in from the side it was swiped from */
  @keyframes slideL { from { opacity: .3; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  @keyframes slideR { from { opacity: .3; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  #app.slide-l { animation: slideL .22s ease-out; } #app.slide-r { animation: slideR .22s ease-out; }
  @media (prefers-reduced-motion: reduce) { #app.slide-l, #app.slide-r { animation: none; } }
  /* back to top: shows up once a long page has been scrolled */
  .to-top { position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 1000; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); color: var(--text);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; box-shadow: 0 4px 14px rgba(0,0,0,.3); opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .2s, transform .2s; }
  .to-top.show { opacity: 1; transform: none; pointer-events: auto; }
  .head-side { display: flex; align-items: center; gap: 8px; }
  .theme-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex: none; }
  .theme-btn svg { flex: none; }
  * { box-sizing: border-box; }
  html { touch-action: manipulation; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; }
  a { color: var(--accent); }
  button { font: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  header { border-bottom: 1px solid var(--line); }
  header { background: linear-gradient(180deg, rgba(242,165,65,.07), rgba(242,165,65,0) 70%); }
  .head { padding-top: max(24px, env(safe-area-inset-top)); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px 24px; }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand svg { flex: none; width: 52px; height: 52px; }
  h1 { margin: 0; font: 600 40px/1 var(--display); letter-spacing: .01em; }
  .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .brand .eyebrow { margin-top: 8px; }
  /* Layout stability: the header ships with its final shape (static tabs, sync pill placeholder)
     and main reserves a screen of height, so nothing jumps while data.js loads */
  #app { min-height: 100vh; min-height: 100svh; }
  .sync { min-width: 190px; min-height: 32px; box-sizing: border-box; font-size: 12px; color: var(--muted); display: inline-flex; gap: 7px; align-items: center; padding: 6px 12px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface); white-space: nowrap; }
  .sync .dot { width: 7px; height: 7px; border-radius: 50%; background: #7BC67E; box-shadow: 0 0 0 3px rgba(123,198,126,.18); }
  nav { display: flex; gap: 4px; overflow-x: auto; margin-top: 20px; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button { background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); padding: 12px 14px; min-height: 44px; cursor: pointer; white-space: nowrap; font-weight: 500; }
  nav button[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  main.wrap { padding-top: 18px; padding-bottom: 48px; display: flex; flex-direction: column; gap: 24px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--min, 220px)), 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; }
  .card h2 { margin: 0 0 14px; font: 500 22px/1.2 var(--display); }
  .card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0 12px; margin-bottom: 14px; }
  .card-head h2 { margin-bottom: 0; flex: none; }
  .kpi-label { font-size: 13px; color: var(--muted); }
  .kpi { font: 500 44px/1.1 var(--display); }
  .kpi.sm { font-size: 24px; line-height: 1.25; }
  .accent { color: var(--accent); }
  .muted { color: var(--muted); }
  .link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 8px 0; font-size: 14px; }
  .bars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .bars .row { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
  .bars .row span:last-child, .num { color: var(--muted); font-variant-numeric: tabular-nums; }
  .track { height: 6px; background: var(--line); border-radius: 3px; margin-top: 4px; }
  .fill { height: 6px; background: var(--accent); border-radius: 3px; }
  .rank { display: inline-block; min-width: 24px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .barbtn { display: block; width: 100%; background: none; border: 0; padding: 3px 0; color: inherit; text-align: left; cursor: pointer; font: inherit; }
  button.year { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; font: inherit; }
  .list-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px 16px; }
  .list-title { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; min-width: 0; }
  .list-title h2 { margin: 0; font: 500 26px/1.2 var(--display); }
  /* the title is mostly lowercase in a tall display font, so its visual middle sits lower than its box: nudge the subtitle to match */
  .list-title > .muted { position: relative; top: 3px; }
  .search { position: relative; width: 100%; max-width: 320px; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }
  .search input[type=search] { max-width: none; padding-left: 38px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .chip-label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .chip { display: inline-flex; align-items: center; gap: 8px; background: rgba(242,165,65,.10); border: 1px solid rgba(242,165,65,.35); border-radius: 999px; padding: 2px 2px 2px 12px; font-size: 14px; max-width: 100%; }
  .chip button { background: none; border: 0; color: var(--muted); cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
  .years { display: flex; align-items: flex-end; gap: 4px; height: 200px; overflow-x: auto; padding-bottom: 4px; }
  .year { flex: 1 0 28px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
  .year .v { font-size: 11px; color: var(--muted); }
  .year .b { width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }
  .year .y { font-size: 11px; color: var(--muted); }
  .months { height: 170px; overflow: visible; }
  .months .year { flex: 1 1 0; min-width: 0; }
  .year .b.part { background: rgba(242,165,65,.45); }
  .year .b.none { background: var(--line); }
  .fun { display: flex; flex-direction: column; gap: 2px; }
  button.card { width: 100%; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; text-align: left; font: inherit; color: inherit; cursor: pointer; transition: border-color .15s; }
  button.card:focus-visible { border-color: var(--accent); }
  .card .go { color: var(--accent); }
  .fun .big { font: 500 26px/1.2 var(--display); color: var(--accent); }
  .fun .small { font-size: 13px; color: var(--muted); }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  input[type=search] { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 16px; min-height: 44px; }
  input::placeholder { color: #8A9099; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .table-box { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  .mlist, .msort { display: none; }
  .mlist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; }
  .mlist li { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .mlist li + li { border-top: 1px solid var(--line); }
  .m-rank { flex: none; min-width: 22px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .m-main { flex: 1; min-width: 0; }
  .m-title { font-weight: 600; overflow-wrap: anywhere; }
  .m-title .open, .m-title .open.muted-btn { background: none; border: 0; padding: 0; font: inherit; color: var(--text); font-weight: 600; text-align: left; cursor: pointer; }
  .m-title .open::after { content: ""; position: absolute; inset: 0; }
  .m-sub { margin-top: 2px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .m-sub button, .m-sub [role="button"] { position: relative; z-index: 1; background: none; border: 0; padding: 0; font: inherit; color: inherit; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; cursor: pointer; }
  .m-sub span[style] { white-space: normal !important; }
  .m-tag { margin-top: 4px; font-size: 12px; } .m-tag br { display: none; } .m-tag .accent ~ .tag::before { content: " · "; white-space: pre; }
  .m-val { flex: none; text-align: right; font: 600 18px/1 var(--display); font-variant-numeric: tabular-nums; }
  .m-val small { display: block; margin-top: 3px; font: 400 11px/1 Inter, system-ui, sans-serif; color: var(--muted); }
  .mchip { display: none; }
  .quick [data-clear] { order: 9; }
  .clear-all { padding: 0; width: 30px; height: 30px; justify-content: center; flex: none; }
  .clear-all svg { flex: none; }
  .empty-filters { text-align: center; padding: 40px 0; border: 1px dashed var(--line-2); border-radius: 12px; } .empty-filters p { margin: 0 0 12px; }
  .quick .icon-chip { padding: 0; width: 30px; height: 30px; justify-content: center; flex: none; }
  /* filters belong to the search above them */
  .list-head + .quick { margin-top: -8px; }
  table { width: 100%; min-width: 760px; border-collapse: collapse; font-size: 14px; }
  th.num, td.num { width: 1%; white-space: nowrap; }
  th { text-align: left; font-weight: 500; color: var(--muted); background: var(--surface); padding: 12px 16px; }
  td { padding: 10px 16px; border-top: 1px solid var(--line); vertical-align: middle; }
  td .open { background: none; border: 0; color: var(--text); font-weight: 600; cursor: pointer; padding: 4px 0; text-align: left; }
  .toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .toolbar h2 { margin: 0; font: 500 26px/1.2 var(--display); }
  .detail { max-width: 760px; display: flex; flex-direction: column; gap: 18px; }
  .detail-top { display: flex; justify-content: space-between; align-items: center; }
  .detail-nav { display: flex; gap: 8px; }
  .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 1px solid var(--line-2); border-radius: 10px; color: var(--text); font-size: 20px; line-height: 1; cursor: pointer; }

<script>
// The iPhone home-screen app resumes from cache, so check for a newer deploy on open and when it comes back to the foreground
(function () {
  const BUILD = "__BUILD__";   // replaced by the GitHub Action on every deploy
  if (BUILD.indexOf("__") === 0 || location.protocol === "file:") return;
  function check() {
    fetch("version.txt?t=" + Date.now(), { cache: "no-store" })
      .then((r) => (r.ok ? r.text() : ""))
      .then((v) => { v = v.trim(); if (v && v !== BUILD && location.search !== "?v=" + v) location.replace(location.pathname + "?v=" + v + location.hash); })
      .catch(() => {});
  }
  check();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
  window.addEventListener("pageshow", (e) => { if (e.persisted) check(); });
})();

<script>
(function () {
  "use strict";
  const DATA = window.LONG_ROAD;
  const app = document.getElementById("app");
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtN = (n) => n.toLocaleString("en-GB");
  // Always three-letter months ("Sep", not the "Sept" that en-GB gives)
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const mon = (d) => MONTHS[d.getMonth()];
  const fmtDate = (iso) => { const d = new Date(iso + "T12:00:00"); return String(d.getDate()).padStart(2, "0") + " " + mon(d) + " " + d.getFullYear(); };
  const DAY = 86400000;

  if (!DATA || !DATA.concerts) {
    app.innerHTML = '<div class="empty">No data yet. Run <code>export.ps1</code> first; it creates <code>data/data.js</code> next to this page.</div>';
    return;
  }

  // extra.js: concerts that cannot be added to setlist.fm (artist missing from its database), each with a source
  const EXTRA = ((window.LONG_ROAD_EXTRA && window.LONG_ROAD_EXTRA.concerts) || []).map((c) => ({ tour: null, info: null, songs: [], ...c, extra: true }));
  const concerts = DATA.concerts.concat(EXTRA).sort((a, b) => b.date.localeCompare(a.date));

  // Discogs: records João owns, by artist (data/discogs.js, exported by the GitHub Action)
  const DISCOGS = window.LONG_ROAD_DISCOGS || null;
  // Deezer fans per artist (data/popularity.js, exported by the GitHub Action): breaks ties in the
  // Year in review top artists, bigger artist first; without the file the most recently seen stays first
  const FANS = (window.LONG_ROAD_POPULARITY && window.LONG_ROAD_POPULARITY.fans) || {};
  const byPopularity = (list) => list.slice().sort((a, b) => b.count - a.count || (FANS[b.key] || 0) - (FANS[a.key] || 0));
  const shelfKey = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/^the /, "").replace(/&/g, "and").replace(/[^a-z0-9]/g, "");
  const shelf = new Map();
  if (DISCOGS) for (const rec of DISCOGS.records) for (const a of rec.artists) { const k = shelfKey(a); if (!shelf.has(k)) shelf.set(k, []); if (!shelf.get(k).includes(rec)) shelf.get(k).push(rec); }
  // artists Discogs spells differently from setlist.fm (setlist.fm name -> Discogs name)
  const SHELF_ALIASES = { "Moullinex": "Moulinex" };
  const onShelf = (artist) => shelf.get(shelfKey(SHELF_ALIASES[artist] || artist)) || null;
  const VINYL = (size) => '<svg class="vinyl" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.8" fill="#050608" stroke="#8A9099" stroke-width="1"/><circle cx="12" cy="12" r="8.4" fill="none" stroke="#5A606A" stroke-width=".7"/><circle cx="12" cy="12" r="6.4" fill="none" stroke="#5A606A" stroke-width=".7"/><circle cx="12" cy="12" r="3.4" fill="#F2A541"/><circle cx="12" cy="12" r=".9" fill="#0F1115"/></svg>';

  // ---------- festivals ----------
  // The API has no festival field. Each festival edition is listed here with its venue and dates
  // (checked one by one, never guessed from the venue alone). "pad" widens the dates by N days
  // to catch a day where only one artist was seen (default 2; 0 for normal concert halls).

  const plain = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();

  // concerts are newest first, so every Map below is filled in order of last seen; the sorts are stable and keep that order on ties

    const m = new Map();
    for (const x of list) { const k = keyFn(x); if (k == null || k === "") continue; m.set(k, (m.get(k) || 0) + 1); }

  const venueKey = (c) => c.venue + "||" + (c.city || "");

  const songsOnStage = [...playedMap.values()].sort((a, b) => b.count - a.count);

  // oldest first, same-day ties by setlist id (stable whatever order the API returns)
  // setlist.fm has no stage times, so the order of same-day concerts is arbitrary.
  // Reached milestones are frozen here by setlist id and never recalculated; add each new one when it is reached.
  const FIXED_MILESTONES = {
    concerts: { 1: "4beb2b76", 50: "53d473f9", 100: "3bd3606c", 250: "bd059de", 500: "3a25d33", 750: "43b43717", 1000: "3b502018" }
  };
  // oldest first; same-day ties broken by setlist id, then each frozen milestone is moved to its number within its day
  const chrono = concerts.slice().sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  Object.entries(FIXED_MILESTONES.concerts).forEach(([n, id]) => {
    const from = chrono.findIndex((c) => c.id === id), to = n - 1;
    if (from >= 0 && chrono[to] && chrono[to].date === chrono[from].date) chrono.splice(to, 0, chrono.splice(from, 1)[0]);
  });
  const chronoIdx = new Map(chrono.map((c, i) => [c.id, i]));
  const firstHeard = new Map();   // songKey -> id of the concert where João first heard the song, whoever played it
  for (const c of chrono) for (const s of c.songs || []) if (!s.tape && s.name && !firstHeard.has(songKey(s, c))) firstHeard.set(songKey(s, c), c.id);

  // competition ranking: ties share a rank (1, 2, 2, 4), like setlist.fm
  const withRank = (list) => { let r = 0; return list.map((x, i) => { if (i === 0 || x.count !== list[i - 1].count) r = i + 1; x.rank = r; return x; }); };
  [artists, venues, festivals, songs, countries].forEach(withRank);

  // longest streak of consecutive days with a concert, and longest gap
  const days = [...new Set(concerts.map((c) => c.date))].sort();
  let best = { len: 0 }, cur = { len: 0 }, gap = { days: 0 };
  for (let i = 0; i < days.length; i++) {
    const t = Date.parse(days[i]);
    const prev = i ? Date.parse(days[i - 1]) : null;
    if (prev !== null && t - prev === DAY) { cur.len++; cur.end = days[i]; }
    else cur = { len: 1, start: days[i], end: days[i] };
    if (cur.len > best.len) best = { ...cur };
    if (prev !== null && (t - prev) / DAY > gap.days) gap = { days: Math.round((t - prev) / DAY), from: days[i - 1], to: days[i] };
  }
  const oldest = concerts[concerts.length - 1];
  const artistSpan = (name) => { const l = concerts.filter((c) => c.artist === name); return { first: l[l.length - 1].date, last: l[0].date }; };

  // rarities: covers heard live and songs seen on their live debut
  // real live debuts only: "tour debut" or "first time live since 2017" are not
  const LIVE_DEBUT = /live debut|first time ever|first time live(?! since)|live premiere|world premiere/i;
  const coverMap = new Map();
  const debuts = [];
  for (const c of concerts) for (const s of c.songs || []) {
    if (s.tape || !s.name) continue;
    if (s.cover) {
      const k = s.name + "||" + s.cover + "||" + c.artist;
      const e = coverMap.get(k) || { name: s.name, original: s.cover, artist: c.artist, count: 0 };
      e.count++; coverMap.set(k, e);
    }
    if (s.info && LIVE_DEBUT.test(s.info)) debuts.push({ name: s.name, artist: c.artist, date: c.date, id: c.id, info: s.info });
  }
  const covers = [...coverMap.values()].sort((a, b) => b.count - a.count);
  const heardOnce = songs.filter((s) => s.count === 1).length;

  // ---------- rendering helpers ----------
  // select styled as a filter chip; opts are [value, text], the first one is "everything"
  // prefix is shown only on the chip ("Sort: Artist"); o[2] adds attributes to an option; attrs go on the select
  const qpick = (id, label, opts, cur, prefix, attrs) => {
    const on = opts.find((o) => o[0] === cur) || opts[0];
    return '<span class="toggle qpick' + (cur ? " on" : "") + '"><span>' + (cur ? (prefix || "") + esc(on[1].replace(/ \([\d,]+\)$/, "")) : esc(label)) + '</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>' +
      '<select id="' + id + '" aria-label="' + label + '"' + (attrs || "") + ">" + opts.map((o) => '<option value="' + esc(o[0]) + '"' + (o[2] || "") + (o[0] === cur ? " selected" : "") + ">" + esc(o[1]) + "</option>").join("") + "</select></span>";
  };
  // options for a filter chip: the values found in list (already narrowed by the other filters) with their counts;
  // the current choice stays even when nothing is left for it
  const facet = (list, keyFn, cur, allLabel, newestFirst) => {
    let xs = countBy(list, keyFn);
    if (newestFirst) xs.sort((a, b) => b.key.localeCompare(a.key));
    if (cur && !xs.some((x) => x.key === cur)) xs.unshift({ key: cur, count: 0 });
    return [["", allLabel]].concat(xs.map((x) => [x.key, x.key + " (" + x.count + ")"]));
  };
  // round × at the end of a filter row while any of its filters (or the sort) is on
  const clearAll = (on, scope) => on || state.sorts[scope] ? '<button type="button" class="toggle clear-all" data-clear="' + scope + '" aria-label="Clear all filters" title="Clear all filters">' +
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>' : "";
  // share icon used by the image buttons (concert page, Year in review)
  const SHARE_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>';
  const fattr = (f, v, y) => ' data-f="' + f + '" data-v="' + esc(v) + '"' + (y ? ' data-y="' + esc(y) + '"' : "");
  const aattr = (name) => ' data-artist="' + esc(name) + '"';
  // attrFn(x) returns [field, value, year?] (opens the concert list filtered) or an attribute string
  const bars = (list, labelFn, attrFn) => {
    const top = list[0] ? list[0].count : 1;

      const at = attrFn ? attrFn(x) : null;
      const inner = '<div class="row"><span>' + (x.rank ? '<span class="rank">' + x.rank + "</span>" : "") + labelFn(x) + "</span><span>" + x.count + "</span></div>" +
        '<div class="track"><div class="fill" style="width:' + Math.max(2, Math.round(x.count / top * 100)) + '%"></div></div>';
      return "<li>" + (at ? '<button type="button" class="barbtn"' + (typeof at === "string" ? at : fattr(...at)) + ">" + inner + "</button>" : '<div class="barbtn static">' + inner + "</div>") + "</li>";
    }).join("") + "</ol>";
  };
  // act: optional click attributes (fattr, aattr, data-tab, data-open, data-yr); the whole card becomes a button
  const box = (cls, act, inner) => act ? '<button type="button" class="' + cls + '"' + act + ">" + inner + "</button>" : '<div class="' + cls + '">' + inner + "</div>";
  const kpi = (label, value, extra, act) => box("card", act, '<div class="kpi-label">' + label + '</div><div class="kpi">' + value + "</div>" + (extra ? '<div class="kpi-label">' + extra + "</div>" : ""));
  const fun = (label, big, small, act) => box("card fun", act, '<div class="kpi-label">' + label + '</div><div class="big">' + big + '</div><div class="small">' + (small || "") + "</div>");
  const tabAttr = (t) => ' data-tab="' + t + '"';
  const openAttr = (c) => ' data-open="' + esc(c.id) + '"';
  const yrAttr = (y) => ' data-yr="' + esc(y) + '"';
  const searchBox = (id, label, placeholder, value) => '<div class="search"><label for="' + id + '" class="sr-only">' + label + "</label>" +
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A9099" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
    '<input id="' + id + '" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" placeholder="' + placeholder + '" value="' + esc(value) + '"></div>';
  const artistBtn = (name, cls) => '<button type="button" class="' + (cls || "open") + '"' + aattr(name) + ">" + esc(name) + "</button>";
  const notes = (c) => (c.festival ? '<span class="accent">' + esc(c.festival) + "</span>" : "") + (c.festival && c.tour ? "<br>" : "") + (c.tour ? '<span class="tag">' + esc(c.tour) + "</span>" : "");
  const plural = (n, one, many) => fmtN(n) + " " + (n === 1 ? one : many);

  // Sortable tables: rows are arrays of cells { h: html, s: sort value }; sorting happens on the data,
  // before "Show more" limits, so the whole list is sorted and not only what is on screen.
  const cell = (h, s) => ({ h: h, s: s === undefined ? h : s });
  // m(row) describes the mobile layout of a row: { rank, title, sub: [html…], tag, value, unit }.
  // Phones get that two-line list instead of the wide table, so nothing scrolls sideways.
  // bar: filter chips shown above the list; on phones the sort chip joins the same row
  function table(id, cols, rows, limit, m, bar) {
    const st = state.sorts[id];
    if (st) rows = rows.slice().sort((a, b) => {
      const x = a[st.col].s, y = b[st.col].s;
      const r = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "en", { sensitivity: "base" });
      return st.dir * r;
    });
    const shown = limit ? rows.slice(0, limit) : rows;
    const sortChips = m ? '<span class="mchip">' + qpick("ms-" + id, "Sort", [["", "Default"]].concat(cols.map((c, i) => c.label === "#" ? null : [String(i), c.label, ' data-num="' + (c.num ? 1 : 0) + '"']).filter(Boolean)),
      st ? String(st.col) : "", "", ' data-sortsel="' + id + '"') +
      (st ? '<button type="button" class="toggle on icon-chip" data-sortdir="' + id + '" aria-label="' + (st.dir > 0 ? "Ascending, switch to descending" : "Descending, switch to ascending") + '">' + (st.dir > 0 ? "↑" : "↓") + "</button>" : "") + "</span>" : "";
    const sortBar = bar ? '<div class="quick">' + bar + sortChips + "</div>" : m ? '<div class="quick msort">' + sortChips + "</div>" : "";
    // a filtered list that ends up empty says so and offers the way back
    if (bar && !rows.length) return sortBar + '<div class="empty empty-filters"><p>Nothing matches these filters.</p><button type="button" class="toggle on" data-clear="' + id + '">Clear filters</button></div>';
    const mlist = m ? '<ul class="mlist">' + shown.map((r) => {
      // links in the second line are spans: Safari keeps a button as one block, so a long name broke the line apart
      const x = m(r), sub = (x.sub || []).filter(Boolean).map((h) => h.replace(/<button type="button"/g, '<span role="button" tabindex="0"').replace(/<\/button>/g, "</span>"));
      return '<li>' + (x.rank !== undefined ? '<span class="m-rank">' + x.rank + "</span>" : "") +
        '<div class="m-main"><div class="m-title">' + x.title + "</div>" +
        (sub.length ? '<div class="m-sub">' + sub.join(" · ") + "</div>" : "") + (x.tag ? '<div class="m-tag">' + x.tag + "</div>" : "") + "</div>" +
        (x.value ? '<span class="m-val">' + x.value + (x.unit ? "<small>" + x.unit + "</small>" : "") + "</span>" : "") + "</li>";
    }).join("") + "</ul>" : "";
    return sortBar + mlist + '<div class="table-box' + (m ? " has-mlist" : "") + '"><table><thead><tr>' + cols.map((c, i) => {
      const on = st && st.col === i;
      return '<th scope="col"' + (c.num ? ' class="num"' : "") + (on ? ' aria-sort="' + (st.dir > 0 ? "ascending" : "descending") + '"' : "") +
        '><button type="button" class="th-btn" data-sort="' + id + "|" + i + "|" + (c.num ? 1 : 0) + '">' + c.label +
        '<span class="arrow" aria-hidden="true">' + (on ? (st.dir > 0 ? "↑" : "↓") : "↕") + "</span></button></th>";
    }).join("") + "</tr></thead><tbody>" +
      shown.map((r) => "<tr>" + r.map((c, i) => "<td" + (cols[i].cls ? ' class="' + cols[i].cls + '"' : "") + ">" + c.h + "</td>").join("") + "</tr>").join("") +
      "</tbody></table></div>" +
      (limit && rows.length > limit ? '<div class="more"><button class="btn" data-more="' + id + '" data-shown="' + limit + '">Show more</button></div>' : "");
  }
  // fresh: optional set of concerts to mark with the first-time dot
  const concertRows = (list, fresh) => list.map((c) => [
    cell('<span style="white-space:nowrap">' + fmtDate(c.date) + "</span>", c.date),
    cell('<button type="button" class="open" data-open="' + esc(c.id) + '"' + (fresh && fresh.has(c) ? ' title="First time you saw them"' : "") + ">" + (fresh && fresh.has(c) ? '<span class="new-dot" aria-hidden="true"></span>' : "") + esc(c.artist) + "</button>", c.artist),
    cell(esc(c.venue), c.venue),
    cell(esc(c.city), c.city),
    cell(notes(c), (c.festival || "") + (c.tour || "")),
    cell(String((c.songs || []).length || ""), (c.songs || []).length)
  ]);
  const concertM = (r) => ({ title: r[1].h, sub: [r[0].h, r[2].h, r[3].h], tag: r[4].h, value: r[5].h, unit: r[5].s === 1 ? "song" : "songs" });
  const CONCERT_COLS = [{ label: "Date", cls: "muted" }, { label: "Artist" }, { label: "Venue" }, { label: "City", cls: "muted" }, { label: "Notes" }, { label: "Songs", num: true, cls: "num" }];

  const FILTERS = {
    artist: { label: "Artist", test: (c, v) => c.artist === v, show: (v) => v },
    venue: { label: "Venue", test: (c, v) => !c.festival && c.venue + "||" + c.city === v, show: (v) => v.replace("||", ", ") },
    festival: { label: "Festival", test: (c, v) => c.festival === v, show: (v) => v },
    country: { label: "Country", test: (c, v) => c.country === v, show: (v) => v },
    city: { label: "City", test: (c, v) => c.city === v, show: (v) => v },
    year: { label: "Year", test: (c, v) => c.date.startsWith(v), show: (v) => v },
    month: { label: "Month", test: (c, v) => c.date.startsWith(v), show: (v) => new Date(v + "-15").toLocaleDateString("en-GB", { month: "long", year: "numeric" }) },
    day: { label: "Day", test: (c, v) => c.date === v, show: (v) => fmtDate(v) },
    range: { label: "Dates", test: (c, v) => { const [a, b] = v.split("|"); return c.date >= a && c.date <= b; }, show: (v) => v.split("|").map(fmtDate).join(" to ") },
    weekday: { label: "Weekday", test: (c, v) => weekdayOf(c.date) === v, show: (v) => v },
    song: { label: "Song", test: (c, v) => { const [a, n] = v.split("||"); return (c.songs || []).some((s) => !s.tape && s.name && songKey(s, c) === plain(n) + "||" + plain(a)); }, show: (v) => v.split("||").reverse().join(" · ") },
    newArtists: { label: "First time seen", test: (c, v) => firstSeen.get(c.artist) === c.date && c.date.startsWith(v), show: (v) => v || "All years" },
    venues: { label: "Venues", test: (c, v) => !c.festival && c.date.startsWith(v), show: (v) => v },
    festivals: { label: "Festival concerts", test: (c, v) => !!c.festival && c.date.startsWith(v), show: (v) => v }
  };

  const state = { tab: "overview", q: "", detail: null, limits: {}, artistQ: "", songQ: "", filter: null, artist: null, venue: null, festival: null, song: null, kind: "", country: "", cYear: "", venueCountry: "", festCountry: "", mapKind: "", venueCity: "", mapYears: "", year: byYear.length ? byYear[byYear.length - 1].key : null, sorts: {} };
  const limitOf = (id, def) => state.limits[id] || def;
  const TABS = [["overview", "Overview"], ["concerts", "Concerts"], ["artists", "Artists"], ["venues", "Venues"], ["festivals", "Festivals"], ["songs", "Songs"], ["years", "Year in review"], ["map", "Map"]];

  function renderTabs() {
    document.getElementById("tabs").innerHTML = TABS.map(([id, label]) =>
      '<button type="button" data-tab="' + id + '"' + (state.tab === id ? ' aria-current="page"' : "") + ">" + label + "</button>").join("");
    // keep the active tab visible when the tab bar scrolls sideways (phones)
    const nav = document.getElementById("tabs"), cur = nav.querySelector("[aria-current]");
    if (cur && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = cur.offsetLeft - (nav.clientWidth - cur.offsetWidth) / 2;
    fadeTabs();
  }
  // fade the right edge only while there are more tabs to scroll to
  const tabScroll = {};
  // phones: a sideways swipe moves to the next or previous tab.
  // Not from the screen edges (iOS uses them for back), and not on things that scroll sideways themselves (tab bar, charts, map, tables).
  if (window.matchMedia("(pointer: coarse)").matches) {
    let sw = null;
    const scrollsX = (el) => {
      for (; el && el !== document.body; el = el.parentElement) {
        if (el.id === "map" || el.matches("input, select, textarea, .leaflet-container")) return true;
        const ox = getComputedStyle(el).overflowX;
        if ((ox === "auto" || ox === "scroll") && el.scrollWidth > el.clientWidth + 2) return true;
      }
      return false;
    };
    document.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      sw = e.touches.length === 1 && t.clientX > 24 && t.clientX < window.innerWidth - 24 && !scrollsX(e.target) ? { x: t.clientX, y: t.clientY, at: Date.now() } : null;
    }, { passive: true });
    document.addEventListener("touchend", (e) => {
      if (!sw) return;
      const t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y, quick = Date.now() - sw.at < 700;
      sw = null;
      if (!quick || Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.5) return;
      const i = TABS.findIndex((x) => x[0] === state.tab) + (dx < 0 ? 1 : -1);
      if (i < 0 || i >= TABS.length) return;
      const btn = document.querySelector('#tabs [data-tab="' + TABS[i][0] + '"]');
      if (!btn) return;
      btn.click();
      app.classList.remove("slide-l", "slide-r"); void app.offsetWidth;
      app.classList.add(dx < 0 ? "slide-l" : "slide-r");

  }
  const toTop = document.getElementById("toTop");
  let topTick = false;
  window.addEventListener("scroll", () => {
    if (topTick) return; topTick = true;
    requestAnimationFrame(() => { const on = window.scrollY > 1200; toTop.classList.toggle("show", on); toTop.tabIndex = on ? 0 : -1; topTick = false; });
  }, { passive: true });
  const fadeTabs = () => { const nav = document.getElementById("tabs"); nav.classList.toggle("more-right", nav.scrollLeft + nav.clientWidth < nav.scrollWidth - 4); };
  document.getElementById("tabs").addEventListener("scroll", fadeTabs, { passive: true });
  window.addEventListener("resize", fadeTabs);

  // ---------- overview ----------
  const countryCities = (country) => new Set(concerts.filter((c) => c.country === country).map((c) => c.city)).size;
  const mmdd = (d) => String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

  // Upcoming shows come from upcoming.js (copied from the attendance page of setlist.fm)
  function nextUp() {
    const today = new Date().toISOString().slice(0, 10);
    const list = ((window.LONG_ROAD_UPCOMING || {}).shows || []).filter((u) => u.date >= today);
    if (!list.length) return "";
    const days = (d) => Math.round((Date.parse(d) - Date.parse(today)) / DAY);
    const when = (n) => n === 0 ? "Tonight" : n === 1 ? "Tomorrow" : n < 60 ? "in " + n + " days" : "in " + Math.round(n / 30) + " months";
    const place = (p) => { const parts = String(p || "").split(", "); return esc(parts.length >= 3 ? parts.slice(0, -2).join(", ") + " · " + parts[parts.length - 2] : p || ""); };
    return '<section class="card" aria-labelledby="h-next"><div class="card-head"><h2 id="h-next">Next up</h2><span class="muted">' + plural(list.length, "show", "shows") + " booked</span></div>" +

          '<span class="otd-main"><strong>' + esc(u.artist || "") + '</strong><span class="muted">' + place(u.place) + "" + "</span></span>" +

      }).join("") + "</ol>" +
      (list.length > 4 ? '<button type="button" class="link" id="nextAll" style="margin-top:10px">' + (state.nextAll ? "Show less" : "Show all " + list.length) + "</button>" : "") +
      "</section>";
  }

  function lastSeen() {
    const today = new Date().toISOString().slice(0, 10);
    const list = chrono.slice(-4).reverse();
    const ago = (d) => { const n = Math.round((Date.parse(today) - Date.parse(d)) / DAY);
      return n <= 0 ? "Today" : n === 1 ? "Yesterday" : n < 60 ? n + " days ago" : n < 730 ? Math.round(n / 30) + " months ago" : Math.round(n / 365) + " years ago"; };
    return '<section class="card" aria-labelledby="h-last"><div class="card-head"><h2 id="h-last">Last seen</h2><span class="muted">' + plural(chrono.length, "concert", "concerts") + " so far</span></div>" +
      '<ol class="otd-list">' + list.map((c) => {
