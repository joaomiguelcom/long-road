<style>
  :root {
    --bg: #0F1115; --surface: #181B21; --line: #262A31; --line-2: #3A3F48;
    --text: #ECEDEE; --muted: #9AA0A6; --accent: #F2A541; --accent-2: #FFC876; --ok: #7BC67E;
    --display: Oswald, "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  html { touch-action: manipulation; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; }
  a { color: var(--accent); }
  button { font: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  header { border-bottom: 1px solid var(--line); }
  header { background: linear-gradient(180deg, rgba(242,165,65,.07), rgba(242,165,65,0) 70%); }
  .head { padding-top: max(24px, env(safe-area-inset-top)); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px 24px; }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand svg { flex: none; width: 52px; height: 52px; }
  h1 { margin: 0; font: 600 40px/1 var(--display); letter-spacing: .01em; }
  .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .brand .eyebrow { margin-top: 8px; }
  /* Layout stability: the header ships with its final shape (static tabs, sync pill placeholder)
     and main reserves a screen of height, so nothing jumps while data.js loads */
  #app { min-height: 100vh; min-height: 100svh; }
  .sync { min-width: 190px; min-height: 32px; box-sizing: border-box; font-size: 12px; color: var(--muted); display: inline-flex; gap: 7px; align-items: center; padding: 6px 12px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface); white-space: nowrap; }
  .sync .dot { width: 7px; height: 7px; border-radius: 50%; background: #7BC67E; box-shadow: 0 0 0 3px rgba(123,198,126,.18); }
  nav { display: flex; gap: 4px; overflow-x: auto; margin-top: 20px; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button { background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); padding: 12px 14px; min-height: 44px; cursor: pointer; white-space: nowrap; font-weight: 500; }
  nav button[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  main.wrap { padding-top: 28px; padding-bottom: 48px; display: flex; flex-direction: column; gap: 24px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--min, 220px)), 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; }
  .card h2 { margin: 0 0 14px; font: 500 22px/1.2 var(--display); }
  .card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0 12px; margin-bottom: 14px; }
  .card-head h2 { margin-bottom: 0; flex: none; }
  .kpi-label { font-size: 13px; color: var(--muted); }
  .kpi { font: 500 44px/1.1 var(--display); }
  .kpi.sm { font-size: 24px; line-height: 1.25; }
  .accent { color: var(--accent); }
  .muted { color: var(--muted); }
  .link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 8px 0; font-size: 14px; }
  .bars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .bars .row { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
  .bars .row span:last-child, .num { color: var(--muted); font-variant-numeric: tabular-nums; }
  .track { height: 6px; background: var(--line); border-radius: 3px; margin-top: 4px; }
  .fill { height: 6px; background: var(--accent); border-radius: 3px; }
  .rank { display: inline-block; min-width: 24px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .barbtn { display: block; width: 100%; background: none; border: 0; padding: 3px 0; color: inherit; text-align: left; cursor: pointer; font: inherit; }
  button.year { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; font: inherit; }
  .list-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; }
  .list-title { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; min-width: 0; }
  .list-title h2 { margin: 0; font: 500 26px/1.2 var(--display); }
  .search { position: relative; width: 100%; max-width: 320px; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }
  .search input[type=search] { max-width: none; padding-left: 38px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .chip-label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .chip { display: inline-flex; align-items: center; gap: 8px; background: rgba(242,165,65,.10); border: 1px solid rgba(242,165,65,.35); border-radius: 999px; padding: 2px 2px 2px 12px; font-size: 14px; max-width: 100%; }
  .chip button { background: none; border: 0; color: var(--muted); cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
  .years { display: flex; align-items: flex-end; gap: 4px; height: 200px; overflow-x: auto; padding-bottom: 4px; }
  .year { flex: 1 0 28px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
  .year .v { font-size: 11px; color: var(--muted); }
  .year .b { width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }
  .year .y { font-size: 11px; color: var(--muted); }
  .fun { display: flex; flex-direction: column; gap: 2px; }
  button.card { width: 100%; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; text-align: left; font: inherit; color: inherit; cursor: pointer; transition: border-color .15s; }
  button.card:focus-visible { border-color: var(--accent); }
  .card .go { color: var(--accent); }
  .fun .big { font: 500 26px/1.2 var(--display); color: var(--accent); }
  .fun .small { font-size: 13px; color: var(--muted); }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  input[type=search] { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 16px; min-height: 44px; }
  input::placeholder { color: #8A9099; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .table-box { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  .mlist, .msort { display: none; }
  .mlist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; }
  .mlist li { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .mlist li + li { border-top: 1px solid var(--line); }
  .m-rank { flex: none; min-width: 22px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .m-main { flex: 1; min-width: 0; }
  .m-title { font-weight: 600; overflow-wrap: anywhere; }
  .m-title .open, .m-title .open.muted-btn { background: none; border: 0; padding: 0; font: inherit; color: var(--text); font-weight: 600; text-align: left; cursor: pointer; }
  .m-title .open::after { content: ""; position: absolute; inset: 0; }
  .m-sub { margin-top: 2px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .m-sub button { position: relative; z-index: 1; background: none; border: 0; padding: 0; font: inherit; color: inherit; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; cursor: pointer; }
  .m-sub span[style] { white-space: normal !important; }
  .m-tag { margin-top: 4px; font-size: 12px; } .m-tag br { display: none; } .m-tag .accent ~ .tag::before { content: " · "; white-space: pre; }
  .m-val { flex: none; text-align: right; font: 600 18px/1 var(--display); font-variant-numeric: tabular-nums; }
  .m-val small { display: block; margin-top: 3px; font: 400 11px/1 Inter, system-ui, sans-serif; color: var(--muted); }
  .msort { align-items: center; gap: 8px; margin-bottom: 10px; }
  .msort label { margin: 0; white-space: nowrap; }
  .msort select { flex: 1; min-width: 0; }
  table { width: 100%; min-width: 760px; border-collapse: collapse; font-size: 14px; }
  th.num, td.num { width: 1%; white-space: nowrap; }
  th { text-align: left; font-weight: 500; color: var(--muted); background: var(--surface); padding: 12px 16px; }
  td { padding: 10px 16px; border-top: 1px solid var(--line); vertical-align: middle; }
  td .open { background: none; border: 0; color: var(--text); font-weight: 600; cursor: pointer; padding: 4px 0; text-align: left; }
  .toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .toolbar h2 { margin: 0; font: 500 26px/1.2 var(--display); }
  .detail { max-width: 760px; display: flex; flex-direction: column; gap: 18px; }
  .detail-top { display: flex; justify-content: space-between; align-items: center; }
  .detail-nav { display: flex; gap: 8px; }
  .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 1px solid var(--line-2); border-radius: 10px; color: var(--text); font-size: 20px; line-height: 1; cursor: pointer; }
  .icon-btn.off { opacity: .3; cursor: default; }
  .detail-head { display: flex; gap: 16px; align-items: center; }
  .next-date.big { width: 64px; padding: 6px 0 7px; }
  .next-date.big .d { font-size: 30px; }
  .detail-title { margin: 0; font: 600 34px/1.1 var(--display); overflow-wrap: anywhere; }
  .detail-meta { margin-top: 4px; line-height: 1.35; }
  .card h2.detail-title { margin: 0; } /* .card h2 adds a 14px bottom margin */
  .inline-link { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; }
  .fact { font-size: 12px; color: var(--muted); border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 10px; }
  .history { display: flex; flex-direction: column; gap: 8px; }
  .history-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .hist { font: inherit; font-size: 13px; background: var(--line); border: 0; border-radius: 6px; padding: 4px 9px; color: var(--muted); cursor: pointer; }
  .hist.cur { background: var(--accent); color: #0F1115; font-weight: 600; cursor: default; }
  .sec-title { margin: 0; font: 500 18px/1.2 var(--display); }
  .badge { font-size: 11px; border-radius: 999px; padding: 1px 8px; margin-left: 4px; background: rgba(242,165,65,.15); color: var(--accent); white-space: nowrap; }
  .badge.cover { background: var(--line); color: var(--muted); }
  .set-label.encore { color: var(--accent); }
  .btn { align-self: flex-start; background: none; border: 1px solid var(--line-2); border-radius: 8px; color: var(--text); padding: 10px 14px; min-height: 44px; cursor: pointer; }
  ol.setlist { margin: 0; padding-left: 28px; display: flex; flex-direction: column; gap: 4px; }
  ol.setlist li.tape { list-style: none; color: var(--muted); }
  .set-label { margin: 12px 0 4px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .tag { font-size: 12px; color: var(--muted); }
  .more { text-align: center; }
  .about { display: flex; gap: 20px; align-items: flex-start; }
  .about img { flex: none; width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 2px solid var(--line-2); filter: saturate(.9); }
  .about h2 { margin: 0 0 6px; }
  .about p { margin: 0 0 14px; color: var(--muted); max-width: 62ch; }
  .about .btn { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
  .eyebrow-btn { background: none; border: 0; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; text-align: left; }
  @media (max-width: 600px) { .about { flex-direction: column; align-items: center; text-align: center; } .about p { margin-inline: auto; } }
  .duo { display: grid; gap: 16px; } @media (min-width: 900px) { .duo { grid-template-columns: 1fr 1fr; } .duo > :only-child { grid-column: 1 / -1; } }
  button.next-item { width: calc(100% + 16px); background: none; border: 0; font: inherit; text-align: left; cursor: pointer; }
  .next-item { display: flex; align-items: center; gap: 14px; padding: 8px; margin: 0 -8px; border-radius: 8px; color: inherit; text-decoration: none; }
  .next-date { flex: none; width: 52px; text-align: center; border: 1px solid var(--line-2); border-radius: 8px; padding: 4px 0 5px; line-height: 1; }
  .next-date .m { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .next-date .d { display: block; font: 500 24px/1.1 var(--display); }
  .next-date .y { display: block; font-size: 10px; color: var(--muted); margin-top: 1px; }
  .next-when { flex: none; font-size: 13px; color: var(--muted); white-space: nowrap; }

    song: { label: "Song", test: (c, v) => { const [a, n] = v.split("||"); return c.artist === a && (c.songs || []).some((s) => s.name === n && !s.tape); }, show: (v) => v.split("||").reverse().join(" · ") },
    newArtists: { label: "First time seen", test: (c, v) => firstSeen.get(c.artist) === c.date && c.date.startsWith(v), show: (v) => v || "All years" },
    venues: { label: "Venues", test: (c, v) => !c.festival && c.date.startsWith(v), show: (v) => v },
    festivals: { label: "Festival concerts", test: (c, v) => !!c.festival && c.date.startsWith(v), show: (v) => v }
  };

  const state = { tab: "overview", q: "", detail: null, limits: {}, artistQ: "", songQ: "", filter: null, artist: null, year: byYear.length ? byYear[byYear.length - 1].key : null, sorts: {} };
  const limitOf = (id, def) => state.limits[id] || def;
  const TABS = [["overview", "Overview"], ["concerts", "Concerts"], ["artists", "Artists"], ["venues", "Venues"], ["festivals", "Festivals"], ["songs", "Songs"], ["years", "Year in review"], ["map", "Map"]];

  function renderTabs() {
    document.getElementById("tabs").innerHTML = TABS.map(([id, label]) =>
      '<button type="button" data-tab="' + id + '"' + (state.tab === id ? ' aria-current="page"' : "") + ">" + label + "</button>").join("");
    // keep the active tab visible when the tab bar scrolls sideways (phones)
    const nav = document.getElementById("tabs"), cur = nav.querySelector("[aria-current]");
    if (cur && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = cur.offsetLeft - (nav.clientWidth - cur.offsetWidth) / 2;
    fadeTabs();
  }
  // fade the right edge only while there are more tabs to scroll to
  const fadeTabs = () => { const nav = document.getElementById("tabs"); nav.classList.toggle("more-right", nav.scrollLeft + nav.clientWidth < nav.scrollWidth - 4); };
  document.getElementById("tabs").addEventListener("scroll", fadeTabs, { passive: true });
  window.addEventListener("resize", fadeTabs);

  // ---------- overview ----------
  const countryCities = (country) => new Set(concerts.filter((c) => c.country === country).map((c) => c.city)).size;
  const mmdd = (d) => String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

  // Upcoming shows come from upcoming.js (copied from the attendance page of setlist.fm)
  function nextUp() {
    const today = new Date().toISOString().slice(0, 10);
    const list = ((window.LONG_ROAD_UPCOMING || {}).shows || []).filter((u) => u.date >= today);
    if (!list.length) return "";
    const days = (d) => Math.round((Date.parse(d) - Date.parse(today)) / DAY);
    const when = (n) => n === 0 ? "Tonight" : n === 1 ? "Tomorrow" : n < 60 ? "in " + n + " days" : "in " + Math.round(n / 30) + " months";
    const place = (p) => { const parts = String(p || "").split(", "); return esc(parts.length >= 3 ? parts.slice(0, -2).join(", ") + " · " + parts[parts.length - 2] : p || ""); };
    return '<section class="card" aria-labelledby="h-next"><div class="card-head"><h2 id="h-next">Next up</h2><span class="muted">' + plural(list.length, "show", "shows") + " booked</span></div>" +
      '<ol class="otd-list">' + list.slice(0, state.nextAll ? list.length : 4).map((u) => {
        const d = new Date(u.date + "T12:00:00"), n = days(u.date);
        return '<li><a class="next-item" href="' + esc(u.url) + '" target="_blank" rel="noopener">' +
          '<span class="next-date"><span class="m">' + mon(d) + '</span><span class="d">' + d.getDate() + "</span>" + (d.getFullYear() !== new Date().getFullYear() ? '<span class="y">' + d.getFullYear() + "</span>" : "") + "</span>" +
          '<span class="otd-main"><strong>' + esc(u.artist || "") + '</strong><span class="muted">' + place(u.place) + "" + "</span></span>" +
          '<span class="next-when' + (n <= 7 ? " soon" : "") + '">' + when(n) + "</span></a></li>";
      }).join("") + "</ol>" +
      (list.length > 4 ? '<button type="button" class="link" id="nextAll" style="margin-top:10px">' + (state.nextAll ? "Show less" : "Show all " + list.length) + "</button>" : "") +
      "</section>";
  }

  function lastSeen() {
    const today = new Date().toISOString().slice(0, 10);
    const list = chrono.slice(-4).reverse();
    const ago = (d) => { const n = Math.round((Date.parse(today) - Date.parse(d)) / DAY);
      return n <= 0 ? "Today" : n === 1 ? "Yesterday" : n < 60 ? n + " days ago" : n < 730 ? Math.round(n / 30) + " months ago" : Math.round(n / 365) + " years ago"; };
    return '<section class="card" aria-labelledby="h-last"><div class="card-head"><h2 id="h-last">Last seen</h2><span class="muted">' + plural(chrono.length, "concert", "concerts") + " so far</span></div>" +
      '<ol class="otd-list">' + list.map((c) => {
        const d = new Date(c.date + "T12:00:00");
        return '<li><button type="button" class="next-item" data-open="' + esc(c.id) + '">' +
          '<span class="next-date"><span class="m">' + mon(d) + '</span><span class="d">' + d.getDate() + "</span>" + (d.getFullYear() !== new Date().getFullYear() ? '<span class="y">' + d.getFullYear() + "</span>" : "") + "</span>" +
          '<span class="otd-main"><strong>' + esc(c.artist) + '</strong><span class="muted">' + esc(c.festival || c.venue) + " · " + esc(c.city) + "</span></span>" +
          '<span class="next-when">' + ago(c.date) + "</span></button></li>";
      }).join("") + "</ol>" +
      '<button type="button" class="link" data-tab="concerts" style="margin-top:10px">Show all ' + fmtN(chrono.length) + "</button></section>";
  }

  function onThisDay() {
    const today = new Date();
    let day = today, list = [];
    for (let i = 0; i < 366 && !list.length; i++) {
      day = new Date(today.getTime() + i * DAY);
      list = concerts.filter((c) => c.date.slice(5) === mmdd(day));
    }
    if (!list.length) return "";
    const isToday = mmdd(day) === mmdd(today);
    const label = day.toLocaleDateString("en-GB", { day: "numeric", month: "long" });
    const thisYear = today.getFullYear();
    return '<section class="card otd" aria-labelledby="h-otd"><div class="card-head"><h2 id="h-otd">' + (isToday ? "On this day, years ago" : "On " + label + ", years ago") + '</h2><span class="muted">' + (isToday ? "Concert anniversaries · " + label : "Next concert anniversary · nothing on " + today.toLocaleDateString("en-GB", { day: "numeric", month: "long" })) + "</span></div>" +
      '<ul class="otd-list">' + list.map((c) => {
        const y = +c.date.slice(0, 4), ago = thisYear - y;
        return '<li><button type="button" class="otd-item" data-open="' + esc(c.id) + '"><span class="otd-year">' + y + '</span><span class="otd-main"><strong>' + esc(c.artist) + "</strong>" +
          '<span class="muted">' + esc(c.festival || c.venue) + " · " + esc(c.city) + "</span></span>" +
          '<span class="tag">' + (ago === 0 ? "this year" : ago === 1 ? "1 year ago" : ago + " years ago") + "</span></button></li>";
      }).join("") + "</ul></section>";
  }

  // ---------- milestones ----------
  const CONCERT_MARKS = [1, 50, 100, 250, 500, 750, 1000, 1250, 1500, 2000, 2500, 3000];
  function milestones() {
    // oldest first; same-day ties broken by setlist id so the result never depends on the API order
    const asc = concerts.slice().sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
    const byId = new Map(concerts.map((c) => [c.id, c]));
    const pick = (fixed, n, list) => (fixed[n] && byId.get(fixed[n])) || list[n - 1];
    const item = (n, c, what) => '<li><button type="button" class="ms-item" data-open="' + esc(c.id) + '"><span class="ms-n">' + ordinal(n) + '</span>' +
      '<span class="ms-main"><strong>' + esc(c.artist) + '</strong><span class="muted">' + fmtDate(c.date) + " · " + esc(c.festival || c.venue) + "</span></span></button></li>";
    const nextC = CONCERT_MARKS.find((m) => m > asc.length);
    const progress = (have, next, prevMark, label) => next ? '<div class="ms-next"><div class="row"><span>Next: ' + ordinal(next) + " " + label + '</span><span class="muted">' + (next - have) + " to go</span></div>" +
      '<div class="track"><div class="fill" style="width:' + Math.round((have - prevMark) / (next - prevMark) * 100) + '%"></div></div></div>' : "";
    const lastC = CONCERT_MARKS.filter((m) => m <= asc.length).pop() || 0;
    return '<section aria-labelledby="h-ms"><h2 id="h-ms" style="margin:0 0 14px;font:500 22px/1.2 var(--display)">Milestones</h2><div class="card">' +
      '<h2 class="sr-only">Concerts</h2><ol class="ms-list">' + CONCERT_MARKS.filter((m) => m <= asc.length).map((m) => item(m, pick(FIXED_MILESTONES.concerts, m, asc), "concert")).join("") + "</ol>" + progress(asc.length, nextC, lastC, "concert") + "</div></section>";
  }

  function overview() {
    const topSong = songs[0];
    const pjSong = songs.find((s) => s.artist === "Pearl Jam");
    const topDay = byDay[0];
    const topArtist = artists[0];
    const span = topArtist ? artistSpan(topArtist.key) : null;
    const maxYear = Math.max(...byYear.map((y) => y.count));
    const yearsTop = byYear.slice().sort((a, b) => b.count - a.count)[0];
    return '' +
      '<div class="duo">' + nextUp() + lastSeen() + "</div>" +
      '<section class="grid kpis" aria-label="Summary">' +
        kpi("Concerts", '<span class="accent">' + fmtN(concerts.length) + "</span>", "", tabAttr("concerts")) +
        kpi("Different artists", fmtN(artists.length), "", tabAttr("artists")) +
        kpi("Songs heard live", fmtN(songsHeard), "", tabAttr("songs")) +
        kpi("Venues", fmtN(venues.length), fmtN(cities.length) + " cities · " + plural(countries.length, "country", "countries"), tabAttr("venues")) +
        kpi("Festivals", fmtN(festivals.length), fmtN(festivals.reduce((n, f) => n + f.count, 0)) + " editions · " + fmtN(festivals.reduce((n, f) => n + f.concerts, 0)) + " concerts", tabAttr("festivals")) +
      "</section>" +
      '<section class="card"><div class="card-head"><h2>Most seen artists</h2><button class="link" data-tab="artists">See all</button></div>' +
        bars(artists.slice(0, 10), (a) => esc(a.key), (a) => aattr(a.key)) + "</section>" +
      '<section class="card"><div class="card-head"><h2>Venues</h2><button class="link" data-tab="venues">See all</button></div>' +
        bars(venues.slice(0, 10), (v) => esc(v.name) + ' <span class="muted">· ' + esc(v.city) + "</span>", (v) => ["venue", v.key]) +
        '<p class="tag" style="margin:12px 0 0">Festival concerts are not counted here.</p></section>' +
      '<section class="card"><div class="card-head"><h2>Festivals</h2><button class="link" data-tab="festivals">See all</button></div>' +
        bars(festivals.slice(0, 10), (f) => esc(f.name) + ' <span class="muted">· ' + f.concerts + " concerts</span>", (f) => ["festival", f.name]) +
        '<p class="tag" style="margin:12px 0 0">Bars show editions attended.</p></section>' +
      '<section class="card"><div class="card-head"><h2>Countries</h2><button class="link" data-tab="map">See map</button></div>' +
        bars(countries, (c) => esc(c.key) + ' <span class="muted">· ' + plural(countryCities(c.key), "city", "cities") + "</span>", (c) => ["country", c.key]) + "</section>" +
      '<section class="card" aria-labelledby="h-year"><div class="card-head"><h2 id="h-year">Concerts per year</h2><button class="link" data-tab="years">Year in review</button></div><div class="years">' +
        byYear.map((y) => '<button type="button" class="year"' + fattr("year", y.key) + ' title="' + y.key + ": " + y.count + ' concerts" aria-label="' + y.key + ": " + y.count + ' concerts"><span class="v">' + y.count + '</span><span class="b" style="display:block;height:' + Math.round(y.count / maxYear * 150) + 'px"></span><span class="y">' + "’" + y.key.slice(2) + "</span></button>").join("") +
      "</div></section>" +
      onThisDay() +
      '<section aria-labelledby="h-fun"><h2 id="h-fun" style="margin:0 0 14px;font:500 22px/1.2 var(--display)">Fun facts</h2><div class="grid" style="--min:240px">' +
        (topSong ? fun("Most heard song live", esc(topSong.name), esc(topSong.artist) + " · " + topSong.count + " times", fattr("song", topSong.artist + "||" + topSong.name)) : "") +
        (pjSong && pjSong !== topSong ? fun("Top Pearl Jam song live", esc(pjSong.name), pjSong.count + " times", fattr("song", pjSong.artist + "||" + pjSong.name)) : "") +
        (yearsTop ? fun("Busiest year", yearsTop.key, yearsTop.count + " concerts", yrAttr(yearsTop.key)) : "") +
        (byMonth[0] ? fun("Busiest month", new Date(byMonth[0].key + "-15").toLocaleDateString("en-GB", { month: "long", year: "numeric" }), byMonth[0].count + " concerts", fattr("month", byMonth[0].key)) : "") +
        (best.len > 1 ? fun("Longest streak", best.len + " nights in a row", fmtDate(best.start) + " to " + fmtDate(best.end), fattr("range", best.start + "|" + best.end)) : "") +
        (topDay ? fun("Most concerts in one day", topDay.count, fmtDate(topDay.key), fattr("day", topDay.key)) : "") +
        (weekdays[0] ? fun("Favourite night out", weekdays[0].key, weekdays[0].count + " concerts", fattr("weekday", weekdays[0].key)) : "") +
        (gap.days ? fun("Longest break", gap.days + " days", fmtDate(gap.from) + " to " + fmtDate(gap.to), fattr("range", gap.from + "|" + gap.to)) : "") +
        (oldest ? fun("Where it all began", esc(oldest.artist), fmtDate(oldest.date) + " · " + esc(oldest.venue), openAttr(oldest)) : "") +
        (span ? fun("Most loyal to", esc(topArtist.key), "Seen " + topArtist.count + " times, " + span.first.slice(0, 4) + "–" + span.last.slice(0, 4), aattr(topArtist.key)) : "") +
        (covers.length ? fun("Covers heard live", fmtN(covers.reduce((n, x) => n + x.count, 0)), "Most heard: " + esc(covers[0].name) + " by " + esc(covers[0].artist), tabAttr("songs")) : "") +
        (reunion ? fun("Longest wait for an encore", esc(reunion.artist), Math.floor(reunion.days / 365.25) + " years between " + fmtDate(reunion.from) + " and " + fmtDate(reunion.to), aattr(reunion.artist)) : "") +
        (songs.length ? fun("One-time songs", fmtN(heardOnce), "Songs you only heard live once", tabAttr("songs")) : "") +
      "</div></section>" +
      milestones() + about();
  }

  function about() {
    const first = chrono[0].date.slice(0, 4);
    return '<section class="card about" id="about" aria-labelledby="h-about">' +
      '<img src="img/me.jpg" alt="João Miguel" width="96" height="96">' +
      '<div><h2 id="h-about">About me</h2>' +
      "<p>Hi, I'm João Miguel. I've been going to concerts since " + first + ", " + fmtN(chrono.length) + " so far, from tiny clubs to muddy festival fields. " +
      artistBtn("Pearl Jam", "text-link") + " is the reason this archive is called Long Road. When I'm not at a show, I'm probably at home spinning records.</p>" +
      '<a class="btn" href="https://www.discogs.com/user/ojoaomiguel" target="_blank" rel="noopener">' +
      VINYL(22) +
      "My record collection on Discogs</a></div></section>";
  }

  // ---------- concerts ----------
  function matches(c, q) {
    return [c.artist, c.venue, c.venueThen, c.city, c.country, c.tour, c.festival, c.date].some((f) => f && f.toLowerCase().includes(q));
  }

  function concertList() {
    if (state.detail) return concertDetail(state.detail);
    const q = state.q.trim().toLowerCase();
    const F = state.filter && FILTERS[state.filter.f];
    let list = F ? concerts.filter((c) => F.test(c, state.filter.v) && (!state.filter.y || c.date.startsWith(state.filter.y))) : concerts;
    if (q) list = list.filter((c) => matches(c, q));
    return '' +
      '<div class="list-head"><div class="list-title"><h2>' + plural(list.length, "concert", "concerts") + "</h2>" +
      (F ? '<span class="chip"><span class="chip-label">' + F.label + "</span><strong>" + esc(F.show(state.filter.v)) + (state.filter.y ? " · " + esc(state.filter.y) : "") + '</strong><button type="button" id="clearf" aria-label="Clear filter"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span>' : "") +
      "</div>" + searchBox("q", "Search concerts", "Search artist, venue, city, year", state.q) + "</div>" +
      table("concerts", CONCERT_COLS, concertRows(list), limitOf("concerts", 100), concertM);
  }

  function concertDetail(id) {
    const c = concerts.find((x) => x.id === id);
    if (!c) return "";
    const groups = [];
    for (const s of c.songs || []) {
      let g = groups[groups.length - 1];
      if (!g || g.set !== s.set) { g = { set: s.set, songs: [] }; groups.push(g); }
      g.songs.push(s);
    }
    const idx = chronoIdx.get(c.id), prev = chrono[idx - 1], next = chrono[idx + 1];
    const d = new Date(c.date + "T12:00:00");
    const link = (label, attr) => '<button type="button" class="inline-link"' + attr + ">" + label + "</button>";
    // header meta: festival / venue / city, each opening the filtered list
    const meta = [
      c.festival ? link(esc(c.festival), fattr("festival", c.festival)) : null,
      (c.festival ? esc(c.venue) : link(esc(c.venue), fattr("venue", venueKey(c)))) + (c.venueThen ? ' <span class="tag">(' + esc(c.venueThen) + ")</span>" : ""),
      link(esc(c.city), fattr("city", c.city))
    ].filter(Boolean).join(" · ");
    // context facts
    const withArtist = chrono.filter((x) => x.artist === c.artist);
    const nth = withArtist.findIndex((x) => x.id === c.id) + 1;
    const nights = new Set(chrono.filter((x, i) => i <= idx && x.venue === c.venue && x.city === c.city).map((x) => x.date)).size;
    const facts = ['<span class="fact">Concert #' + fmtN(idx + 1) + " of " + fmtN(chrono.length) + "</span>",
      '<span class="fact">' + (c.festival ? "Your " + ordinal(nights) + " day at " + esc(c.venue) : "Your " + ordinal(nights) + " night at " + esc(c.venue)) + "</span>"];
    if (c.stage && !/^region of /i.test(c.stage)) facts.push('<span class="fact">' + esc(/palco|stage|tent|clubbing/i.test(c.stage) ? c.stage : c.stage + " stage") + "</span>");
    if (c.tour) facts.push('<span class="fact">' + esc(c.tour) + "</span>");
    const others = withArtist.filter((x) => x.id !== c.id);
    const history = '<div class="history"><span class="kpi-label">' + (others.length ? ordinal(nth) + " time seeing " + esc(c.artist) : "First time seeing " + esc(c.artist)) + "</span>" +
      (others.length ? '<div class="history-list">' + withArtist.map((x) => x.id === c.id ? '<span class="hist cur">' + (x.date.slice(0, 4)) + "</span>" :
        '<button type="button" class="hist"' + ' data-open="' + esc(x.id) + '" title="' + esc(fmtDate(x.date) + " · " + (x.festival || x.venue)) + '">' + x.date.slice(0, 4) + "</button>").join("") + "</div>" : "") + "</div>";
    // setlist
    const played = (c.songs || []).filter((x) => !x.tape && x.name);
    const isNew = (x) => !x.tape && x.name && firstHeard.get(x.name + "||" + c.artist) === c.id;
    const newCount = played.filter(isNew).length, coverCount = played.filter((x) => x.cover).length;
    const encores = groups.filter((g) => /^Encore/.test(g.set)).length;
    const summary = [plural(played.length, "song", "songs"), encores ? plural(encores, "encore", "encores") : "", coverCount ? plural(coverCount, "cover", "covers") : "", newCount && nth > 1 ? newCount + " new for you" : ""].filter(Boolean).join(" · ");
    // tapes (intro/outro music) get no number and are not counted
    let num = 0;
    const setlist = groups.length ?
      '<section><div class="card-head"><h3 class="sec-title">Setlist</h3><span class="muted">' + summary + "</span></div>" +
      groups.map((g, i) => '<div><div class="set-label' + (/^Encore/.test(g.set) ? " encore" : "") + '">' + esc(g.set) + '</div><ol class="setlist">' +
        g.songs.map((x) => (x.tape ? '<li class="tape">' : '<li value="' + (++num) + '">') + esc(x.name) +
          (nth > 1 && isNew(x) ? ' <span class="badge">new for you</span>' : "") +
          (x.cover ? ' <span class="badge cover">' + esc(x.cover) + (x.tape ? " song" : " cover") + "</span>" : "") +
          (x.with ? ' <span class="tag">· with ' + esc(x.with) + "</span>" : "") +
          (x.tape ? ' <span class="tag">(tape)</span>' : "") + (x.info ? ' <span class="tag">· ' + esc(x.info) + "</span>" : "") + "</li>").join("") + "</ol></div>").join("") +
      "</section>"
      : c.extra ? '<p class="tag" style="margin:0">Not on setlist.fm: ' + esc(c.reason || "the artist is not in its database.") + (c.note ? " " + esc(c.note) : "") + (c.source ? ' <a href="' + esc(c.source) + '" target="_blank" rel="noopener">Source</a>' : "") + "</p>"
      : '<p class="tag" style="margin:0">No setlist yet. <a href="' + esc(c.url) + '" target="_blank" rel="noopener">Add it on setlist.fm</a></p>';
    // same night
    const sameNight = chrono.filter((x) => x.date === c.date && x.id !== c.id);
    const night = sameNight.length ? '<div class="history"><span class="muted">Also that night</span><div class="history-list">' + sameNight.map((x) =>
      '<button type="button" class="hist" data-open="' + esc(x.id) + '">' + esc(x.artist) + ((x.festival || x.venue) !== (c.festival || c.venue) ? " · " + esc(x.festival || x.venue) : "") + "</button>").join("") + "</div></div>" : "";
    const navBtn = (x, dir) => x ? '<button type="button" class="icon-btn" data-swap="' + esc(x.id) + '" aria-label="' + (dir < 0 ? "Previous" : "Next") + " concert: " + esc(x.artist) + '" title="' + esc(x.artist + " · " + fmtDate(x.date)) + '">' + (dir < 0 ? "‹" : "›") + "</button>" : '<span class="icon-btn off" aria-hidden="true">' + (dir < 0 ? "‹" : "›") + "</span>";
    return '<article class="card detail">' +
      '<div class="detail-top"><button class="icon-btn" id="back" aria-label="Back">←</button><div class="detail-nav">' + navBtn(prev, -1) + navBtn(next, 1) + "</div></div>" +
      '<div class="detail-head"><span class="next-date big"><span class="m">' + mon(d) + '</span><span class="d">' + d.getDate() + '</span><span class="y">' + d.getFullYear() + "</span></span>" +
        '<div style="min-width:0"><h2 class="detail-title">' + artistBtn(c.artist, "title-link") + '</h2><div class="muted detail-meta">' + meta + "</div></div></div>" +
      '<div class="facts">' + facts.join("") + "</div>" +
      history + night + setlist +
      (c.info ? '<p class="muted" style="margin:0">' + esc(c.info) + "</p>" : "") +

      "</article>";
  }
  const ordinal = (n) => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");

  // ---------- artists ----------
  function artistList() {
    if (state.artist) return artistPage(state.artist);
    const q = state.artistQ.trim().toLowerCase();
    const list = artists.filter((a) => (!q || a.key.toLowerCase().includes(q)) && (!state.shelfOnly || onShelf(a.key)));

      cell(fmtDate(s.first), s.first), cell(fmtDate(s.last), s.last)]; });

      table("artists", [{ label: "#", num: true, cls: "num" }, { label: "Artist" }, { label: "Concerts", num: true, cls: "num" }, { label: "First seen", cls: "muted" }, { label: "Last seen", cls: "muted" }], rows, limitOf("artists", 100),
        (r) => ({ rank: r[0].h, title: r[1].h, sub: [r[3].s.slice(0, 4) === r[4].s.slice(0, 4) ? r[3].s.slice(0, 4) : r[3].s.slice(0, 4) + " – " + r[4].s.slice(0, 4)], value: r[2].h, unit: r[2].s === 1 ? "concert" : "concerts" }));
  }

  // records by this artist in the Discogs collection
  function shelfCard(name) {
    const recs = onShelf(name);
    if (!recs) return "";
    const list = recs.slice().sort((a, b) => (a.year || 9999) - (b.year || 9999));
    return '<section class="card"><div class="card-head"><h2>On the shelf</h2><a class="link" href="https://www.discogs.com/user/' + esc(DISCOGS.user) + '/collection" target="_blank" rel="noopener">Discogs</a></div>' +
      '<ul class="records">' + list.map((r) => '<li><a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + VINYL(18) + '<span><span class="r-title">' + esc(r.title) + '</span><span class="muted">' + [r.year, r.format.split(", ").filter((f) => f !== "All Media").join(", ")].filter(Boolean).map(esc).join(" · ") + "</span></span></a></li>").join("") + "</ul></section>";
  }

  // side projects and solo careers shown on each other's page
  const RELATED = { "Pearl Jam": ["Eddie Vedder", "Temple of the Dog"], "Eddie Vedder": ["Pearl Jam"] };
  function artistPage(name) {
    const a = artists.find((x) => x.key === name);
    if (!a) return "";
    const list = concerts.filter((c) => c.artist === name);
    const first = list[list.length - 1], last = list[0];
    const aSongs = songs.filter((s) => s.artist === name);
    const heard = aSongs.reduce((n, s) => n + s.count, 0);
    const once = aSongs.filter((s) => s.count === 1);
    const aCovers = covers.filter((x) => x.artist === name);
    const aCountries = new Set(list.map((c) => c.country)).size;
    const aFest = list.filter((c) => c.festival).length;
    const top = withRank(aSongs.map((s) => ({ ...s })));
    // deeper song stats once there are a few setlists to compare
    const withSets = list.filter((c) => (c.songs || []).some((s) => !s.tape && s.name)).reverse();
    const ends = (pick) => withRank(countBy(withSets, (c) => { const p = c.songs.filter((s) => !s.tape && s.name); return pick(p).name; }));
    const songStats = withSets.length >= 3 ? (() => {
      const every = aSongs.filter((s) => s.count >= withSets.length);
      const biggest = withSets.reduce((b, c) => (c.songs.filter((s) => !s.tape && s.name).length > b.n ? { c, n: c.songs.filter((s) => !s.tape && s.name).length } : b), { c: null, n: 0 });
      const aDebuts = debuts.filter((d) => d.artist === name);
      const chips = (l) => '<div class="history-list">' + l.map((x) => '<span class="hist">' + esc(x.key) + (x.count > 1 ? " ×" + x.count : "") + "</span>").join("") + "</div>";
      return '<section class="card"><h2>Openers and closers</h2>' +
          '<div class="kpi-label">Opened with</div>' + chips(ends((p) => p[0]).slice(0, 8)) +
          '<div class="kpi-label" style="margin-top:12px">Closed with</div>' + chips(ends((p) => p[p.length - 1]).slice(0, 8)) + "</section>" +
        '<section class="card"><h2>Setlist facts</h2><ul class="facts-list">' +
          "<li>" + (every.length ? "Heard at every show with a setlist (" + withSets.length + "): " + every.map((s) => esc(s.name)).join(" · ") : "No song made it into all " + withSets.length + " setlists") + "</li>" +
          '<li>Longest night: <button type="button" class="text-link" data-open="' + esc(biggest.c.id) + '">' + biggest.n + " songs, " + fmtDate(biggest.c.date) + "</button> at " + esc(biggest.c.festival || biggest.c.venue) + "</li>" +
          (aDebuts.length ? "<li>Live debuts you saw: " + aDebuts.map((d) => esc(d.name) + " (" + d.date.slice(0, 4) + ")").join(" · ") + "</li>" : "") +
        "</ul></section>";
    })() : "";
    const related = (RELATED[name] || []).map((r) => artists.find((x) => x.key === r)).filter(Boolean);
    return '<div class="detail-wide">' +
      '<button class="btn" id="backArtists">← All artists</button>' +
      '<div><div class="eyebrow">#' + a.rank + " most seen artist</div>" +
      '<h2 style="margin:4px 0 0;font:600 40px/1.1 var(--display)">' + esc(name) + "</h2>" +
      '<div class="muted">First seen ' + fmtDate(first.date) + " at " + esc(first.festival || first.venue) + (list.length > 1 ? " · Last seen " + fmtDate(last.date) + " at " + esc(last.festival || last.venue) : "") + "</div></div>" +
      '<section class="grid kpis" aria-label="Artist summary">' +
        kpi("Concerts", '<span class="accent">' + a.count + "</span>", aFest ? aFest + " at festivals" : "", fattr("artist", name)) +
        kpi("Songs heard", fmtN(heard), fmtN(aSongs.length) + " different") +
        kpi("Years", (+last.date.slice(0, 4) - +first.date.slice(0, 4) + 1) + "", first.date.slice(0, 4) + "–" + last.date.slice(0, 4)) +
        kpi("Countries", aCountries + "") +
      "</section>" +
      (top.length ? '<section class="card"><h2>Songs you heard most</h2>' + bars(top.slice(0, 15), (s) => esc(s.name)) + "</section>" : "") +
      (related.length ? '<div class="history"><span class="muted">Also seen</span><div class="history-list">' + related.map((x) => '<button type="button" class="hist"' + aattr(x.key) + ">" + esc(x.key) + " · " + plural(x.count, "concert", "concerts") + "</button>").join("") + "</div></div>" : "") +
      songStats +
      '<section class="card"><div class="card-head"><h2>Concerts</h2><button class="link"' + fattr("artist", name) + ">Open in concert list</button></div>" +
        table("artist-concerts", CONCERT_COLS, concertRows(list), 0, concertM) + "</section>" +
      (once.length ? '<section class="card"><h2>Heard only once</h2><p class="muted" style="margin:0">' + once.map((s) => esc(s.name)).join(" · ") + "</p></section>" : "") +
      (aCovers.length ? '<section class="card"><h2>Covers</h2><p class="muted" style="margin:0">' + aCovers.map((x) => esc(x.name) + " (" + esc(x.original) + ")" + (x.count > 1 ? " ×" + x.count : "")).join(" · ") + "</p></section>" : "") +
      shelfCard(name) +
      "</div>";
  }

  // ---------- venues, festivals, songs ----------
  function venueList() {
    const rows = venues.map((v) => [cell(String(v.rank), v.rank), cell('<button class="open"' + fattr("venue", v.key) + ">" + esc(v.name) + "</button>", v.name), cell(esc(v.city), v.city), cell(String(v.count), v.count)]);

      table("venues", [{ label: "#", num: true, cls: "num" }, { label: "Venue" }, { label: "City", cls: "muted" }, { label: "Concerts", num: true, cls: "num" }], rows, 0,
        (r) => ({ rank: r[0].h, title: r[1].h, sub: [r[2].h], value: r[3].h, unit: r[3].s === 1 ? "concert" : "concerts" }));
  }

  function festivalList() {
    const rows = festivals.map((f) => [cell(String(f.rank), f.rank), cell('<button class="open"' + fattr("festival", f.name) + ">" + esc(f.name) + "</button>", f.name), cell(String(f.count), f.count), cell(String(f.concerts), f.concerts), cell(f.years.join(", "), f.years[0])]);
    festivals.forEach((f, i) => { rows[i].yrs = f.years.slice().sort().map((y) => "’" + String(y).slice(2)).join(" "); });
    return '<div class="list-head"><div class="list-title"><h2>' + plural(festivals.length, "festival", "festivals") + "</h2></div></div>" +
      table("festivals", [{ label: "#", num: true, cls: "num" }, { label: "Festival" }, { label: "Editions", num: true, cls: "num" }, { label: "Concerts", num: true, cls: "num" }, { label: "Years", cls: "muted" }], rows, 0,
        (r) => ({ rank: r[0].h, title: r[1].h, sub: [plural(r[2].s, "edition", "editions")], tag: '<span class="tag">' + r.yrs + "</span>", value: r[3].h, unit: r[3].s === 1 ? "concert" : "concerts" }));
  }

  function songList() {
    const q = plain(state.songQ);
    // songs whose title matches come first, then songs by matching artists
    const list = q ? songs.filter((s) => plain(s.name).includes(q)).concat(songs.filter((s) => !plain(s.name).includes(q) && plain(s.artist).includes(q))) : songs;
    const rows = list.map((s) => [cell(String(s.rank), s.rank), cell(esc(s.name), s.name), cell(artistBtn(s.artist, "open muted-btn"), s.artist), cell(String(s.count), s.count)]);
    const coverRows = covers.map((x) => [cell(esc(x.name), x.name), cell(esc(x.original), x.original), cell(artistBtn(x.artist, "open muted-btn"), x.artist), cell(String(x.count), x.count)]);
    const debutRows = debuts.slice().sort((a, b) => b.date.localeCompare(a.date)).map((d) => [cell('<button type="button" class="open muted-btn" data-open="' + esc(d.id) + '">' + fmtDate(d.date) + "</button>", d.date), cell(esc(d.name), d.name), cell(esc(d.artist), d.artist), cell(esc(d.info), d.info)]);
    return '<div class="list-head"><div class="list-title"><h2>Songs you heard most</h2><span class="muted">' + fmtN(songs.length) + " different songs, " + fmtN(songsHeard) + " in total, " + fmtN(heardOnce) + " heard only once</span></div>" + searchBox("sq", "Search songs", "Search song or artist", state.songQ) + "</div>" +
      (q && !list.length ? '<div class="empty">No songs match.</div>' : "") +
      table("songs", [{ label: "#", num: true, cls: "num" }, { label: "Song" }, { label: "Artist" }, { label: "Times", num: true, cls: "num" }], rows, limitOf("songs", 100),
        (r) => ({ rank: r[0].h, title: r[1].h, sub: [r[2].h], value: r[3].h, unit: r[3].s === 1 ? "time" : "times" })) +
      '<h2 class="section-title">Rarities</h2>' +
      '<section class="card"><h2>Covers heard live</h2>' + (coverRows.length ? table("covers", [{ label: "Song" }, { label: "Original by", cls: "muted" }, { label: "Played by" }, { label: "Times", num: true, cls: "num" }], coverRows, limitOf("covers", 50),
        (r) => ({ title: r[0].h, sub: [r[1].h + " → " + r[2].h], value: r[3].h, unit: r[3].s === 1 ? "time" : "times" })) : '<p class="muted" style="margin:0">None found yet.</p>') + "</section>" +
      '<section class="card"><h2>Live debuts you saw</h2>' + (debutRows.length ? table("debuts", [{ label: "Date", cls: "muted" }, { label: "Song" }, { label: "Artist" }, { label: "Note", cls: "muted" }], debutRows, limitOf("debuts", 50),
        (r) => ({ title: r[1].h, sub: [r[0].h, esc(r[2].s), r[3].h] })) : '<p class="muted" style="margin:0">No songs marked as a live debut on setlist.fm yet.</p>') + "</section>";
  }

  // ---------- year in review ----------
  function yearReview() {
    const y = state.year;
    const list = concerts.filter((c) => c.date.startsWith(y));
    if (!list.length) return '<div class="empty">No concerts in ' + esc(y) + ".</div>";
    const firstEver = new Map();
    for (let i = concerts.length - 1; i >= 0; i--) if (!firstEver.has(concerts[i].artist)) firstEver.set(concerts[i].artist, concerts[i].date);
    const yArtists = withRank(countBy(list, (c) => c.artist));
    const newArtists = yArtists.filter((a) => firstEver.get(a.key).startsWith(y));
    const yVenues = withRank(countBy(list.filter((c) => !c.festival), venueKey).map((v) => { const [name, city] = v.key.split("||"); return { ...v, name, city }; }));
    const yFest = withRank(countBy(list, (c) => c.festival));
    const yMonths = countBy(list, (c) => c.date.slice(0, 7));
    const ySongs = list.reduce((n, c) => n + (c.songs || []).filter((s) => !s.tape).length, 0);
    const first = list[list.length - 1], last = list[0];
    const yi = byYear.findIndex((x) => x.key === y);
    const prev = byYear[yi - 1], next = byYear[yi + 1];
    return '<div class="list-head"><div class="list-title"><h2 style="font-size:40px">' + esc(y) + "</h2>" +
      '<span class="muted">' + plural(list.length, "concert", "concerts") + "</span></div>" +
      '<div class="year-nav">' + (prev ? '<button class="btn" data-year="' + prev.key + '">← ' + prev.key + "</button>" : "") +
      '<label for="ysel" class="sr-only">Year</label><select id="ysel">' + byYear.slice().reverse().map((x) => '<option value="' + x.key + '"' + (x.key === y ? " selected" : "") + ">" + x.key + "</option>").join("") + "</select>" +
      (next ? '<button class="btn" data-year="' + next.key + '">' + next.key + " →</button>" : "") +
      '<button class="btn" id="shareYear">Share</button>' + "</div></div>" +
      '<section class="grid kpis" aria-label="Year summary">' +
        kpi("Concerts", '<span class="accent">' + list.length + "</span>", '<span class="go">See them all</span>', fattr("year", y)) +
        kpi("Artists", yArtists.length + "", newArtists.length + " seen for the first time", fattr("newArtists", y)) +
        kpi("Venues", yVenues.length + "", plural(new Set(list.map((c) => c.city)).size, "city", "cities") + " · " + plural(new Set(list.map((c) => c.country)).size, "country", "countries"), fattr("venues", y)) +
        kpi("Festivals", yFest.length + "", list.filter((c) => c.festival).length + " festival concerts", fattr("festivals", y)) +
        (ySongs ? kpi("Songs heard", fmtN(ySongs), "", fattr("year", y)) : "") +
      "</section>" +
      '<div class="grid" style="--min:240px">' +
        fun("First concert", esc(first.artist), fmtDate(first.date) + " · " + esc(first.festival || first.venue), openAttr(first)) +
        fun("Last concert", esc(last.artist), fmtDate(last.date) + " · " + esc(last.festival || last.venue), openAttr(last)) +
        (yMonths[0] ? fun("Busiest month", new Date(yMonths[0].key + "-15").toLocaleDateString("en-GB", { month: "long" }), yMonths[0].count + " concerts", fattr("month", yMonths[0].key)) : "") +
        (newArtists.length ? fun("New discoveries", newArtists.length + "", newArtists.slice(0, 3).map((a) => esc(a.key)).join(", ") + (newArtists.length > 3 ? "…" : ""), fattr("newArtists", y)) : "") +
      "</div>" +
      '<section class="card"><h2>Top artists</h2>' + bars(yArtists.slice(0, 10), (a) => esc(a.key), (a) => ["artist", a.key, y]) + "</section>" +
      (yVenues.length ? '<section class="card"><h2>Venues</h2>' + bars(yVenues.slice(0, 10), (v) => esc(v.name) + ' <span class="muted">· ' + esc(v.city) + "</span>", (v) => ["venue", v.key, y]) + "</section>" : "") +
      (yFest.length ? '<section class="card"><h2>Festivals</h2>' + bars(yFest, (f) => esc(f.key), (f) => ["festival", f.key, y]) + "</section>" : "");
  }

  // a 1080×1920 image of the year (Instagram story size), to share on a phone or save on desktop;
  // Instagram covers roughly the top 150px and bottom 120px with its own buttons
  async function shareYear(y) {
    const list = concerts.filter((c) => c.date.startsWith(y));
    const yArtists = withRank(countBy(list, (c) => c.artist));
    const firstEver = new Map();
    for (let i = concerts.length - 1; i >= 0; i--) if (!firstEver.has(concerts[i].artist)) firstEver.set(concerts[i].artist, concerts[i].date);
    const nNew = yArtists.filter((a) => firstEver.get(a.key).startsWith(y)).length;
    const nVenues = new Set(list.filter((c) => !c.festival).map(venueKey)).size;
    const nFest = new Set(list.map((c) => c.festival).filter(Boolean)).size;
    const nCities = new Set(list.map((c) => c.city)).size;
    const nCountries = new Set(list.map((c) => c.country)).size;
    const months = Array.from({ length: 12 }, (_, m) => list.filter((c) => +c.date.slice(5, 7) === m + 1).length);
    try { await document.fonts.ready; } catch (e) {}
    const W = 1080, H = 1920, X = 80, R = W - 80, cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const g = cv.getContext("2d");
    const DISP = 'Oswald, "Arial Narrow", sans-serif', BODY = "Inter, system-ui, sans-serif";
    const ACC = "#F2A541", TXT = "#ECEDEE", MUT = "#9AA0A6", LINE = "#262A31";
    const fit = (t, max) => { if (g.measureText(t).width <= max) return t; while (t.length > 1 && g.measureText(t + "…").width > max) t = t.slice(0, -1); return t + "…"; };
    const label = (t, yy) => { g.fillStyle = ACC; g.font = "600 25px " + BODY; g.letterSpacing = "4px"; g.fillText(t, X, yy); g.letterSpacing = "0px"; };
    g.fillStyle = "#0F1115"; g.fillRect(0, 0, W, H);
    const glow = g.createRadialGradient(W - 60, 420, 0, W - 60, 420, 1000);
    glow.addColorStop(0, "rgba(242,165,65,.20)"); glow.addColorStop(1, "rgba(242,165,65,0)");
    g.fillStyle = glow; g.fillRect(0, 0, W, H);
    // everything but the link sits 40px higher (João, 2026-10-25)
    g.save(); g.translate(0, -40);
    // header: road logo and title
    g.save(); g.translate(X, 202); g.scale(1.5, 1.5); g.translate(-6, -8);
    g.fillStyle = "rgba(242,165,65,.35)"; g.beginPath(); g.arc(32, 19, 9, 0, Math.PI * 2); g.fill();
    g.fillStyle = ACC; g.fill(new Path2D("M29.5 19h5L54 58H10zM31.4 23h1.2l.3 5h-1.8zM31 33h2l.5 8h-3zM30.3 46h3.4l.6 12h-4.6z"), "evenodd");
    g.restore();
    g.textBaseline = "alphabetic";
    g.fillStyle = TXT; g.font = "600 46px " + DISP; g.fillText("LONG ROAD", X + 104, 236);
    g.fillStyle = MUT; g.font = "400 27px " + BODY; g.fillText("João Miguel's year in concerts", X + 104, 276);
    // the year, then the concert count
    g.fillStyle = ACC; g.font = "600 230px " + DISP; g.fillText(y, X - 4, 540);
    g.fillStyle = TXT; g.font = "600 160px " + DISP; g.fillText(fmtN(list.length), X - 4, 730);
    const cw0 = g.measureText(fmtN(list.length)).width;
    g.fillStyle = MUT; g.font = "400 46px " + BODY; g.fillText(list.length === 1 ? "concert" : "concerts", X + cw0 + 22, 730);
    // numbers: two rows of three
    const kp = [[yArtists.length, "artists"], [nNew, "new artists"], [nVenues, nVenues === 1 ? "venue" : "venues"],
      [nFest, nFest === 1 ? "festival" : "festivals"], [nCities, nCities === 1 ? "city" : "cities"], [nCountries, nCountries === 1 ? "country" : "countries"]];
    g.fillStyle = LINE; g.fillRect(X, 790, R - X, 2);
    kp.forEach(([v, l], i) => {
      const cw = (R - X) / 3, x = X + (i % 3) * cw, top = 830 + Math.floor(i / 3) * 150;
      g.fillStyle = TXT; g.font = "600 76px " + DISP; g.fillText(fmtN(v), x, top + 70);
      g.fillStyle = MUT; g.font = "400 27px " + BODY; g.fillText(l, x, top + 110);
    });
    // concerts per month
    label("MONTH BY MONTH", 1170);
    const mMax = Math.max(1, ...months), bw = (R - X) / 12, base = 1390;
    months.forEach((n, m) => {
      const h = n ? Math.max(6, 150 * n / mMax) : 3, x = X + m * bw + 6;
      g.fillStyle = n === mMax ? ACC : n ? "rgba(242,165,65,.45)" : LINE; g.fillRect(x, base - h, bw - 12, h);
      g.fillStyle = MUT; g.font = "500 23px " + BODY; g.textAlign = "center";
      g.fillText("JFMAMJJASOND"[m], x + (bw - 12) / 2, base + 36);
      if (n) { g.fillStyle = n === mMax ? TXT : MUT; g.fillText(String(n), x + (bw - 12) / 2, base - h - 10); }
      g.textAlign = "left";
    });
    // top artists
    label("MOST SEEN", 1490);
    yArtists.slice(0, 5).forEach((a, i) => {
      const yy = 1552 + i * 56;
      g.fillStyle = a.rank === 1 ? ACC : MUT; g.font = "600 36px " + DISP; g.fillText(String(a.rank), X, yy);
      g.fillStyle = TXT; g.font = "500 36px " + BODY; g.fillText(fit(a.key, R - X - 160), X + 60, yy);
      g.fillStyle = MUT; g.font = "400 30px " + BODY; g.textAlign = "right"; g.fillText(a.count + "×", R, yy); g.textAlign = "left";
    });
    g.restore();
    g.fillStyle = MUT; g.font = "400 26px " + BODY; g.textAlign = "right"; g.fillText("longroad.joaomiguel.com", R, 1815); g.textAlign = "left";
    const blob = await new Promise((r) => cv.toBlob(r, "image/png"));
    const file = new File([blob], "long-road-" + y + ".png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && window.matchMedia("(pointer: coarse)").matches) {
      try { await navigator.share({ files: [file], title: "Long Road " + y }); } catch (e) {}
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  // ---------- map ----------
  let map = null;
  function mapView() {
    const withCoords = concerts.filter((c) => c.lat != null && c.lng != null);
    if (!withCoords.length) return '<div class="empty">The map needs coordinates. Run <code>export.ps1</code> again (the new version saves them) and reload this page.</div>';
    return '<div class="list-head"><div class="list-title"><h2>Map</h2><span class="muted">' + plural(cities.length, "city", "cities") + " · " + plural(countries.length, "country", "countries") + '</span></div></div><div id="map" role="region" aria-label="Map of concert cities"></div>' +
      '<p class="tag" style="margin:0">Circles are cities (setlist.fm gives coordinates per city, not per venue). Bigger means more concerts. Click one to see its concerts.</p>';
  }
  function loadLeaflet(cb) {
    if (window.L) return cb();
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
    document.head.appendChild(css);
    const js = document.createElement("script");
    js.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    js.onload = cb;
    js.onerror = () => { const el = document.getElementById("map"); if (el) el.innerHTML = '<div class="empty" style="padding:24px">Could not load the map library. Check your internet connection.</div>'; };
    document.head.appendChild(js);
  }
  function initMap() {
    const el = document.getElementById("map");
    if (!el) return;
    loadLeaflet(() => {
      if (!document.getElementById("map")) return;
      const byCity = new Map();
      for (const c of concerts) {
        if (c.lat == null || c.lng == null) continue;
        const k = c.city + "||" + c.country;
        const e = byCity.get(k) || { city: c.city, country: c.country, lat: +c.lat, lng: +c.lng, count: 0, venues: new Map() };
        e.count++; const vn = c.festival || c.venue; e.venues.set(vn, (e.venues.get(vn) || 0) + 1); byCity.set(k, e);
      }
      map = L.map("map", { scrollWheelZoom: false, worldCopyJump: true });
      // Esri tiles need no API key and work when the page is opened from a file (no Referer)
      const esri = "https://server.arcgisonline.com/ArcGIS/rest/services/";
      const dark = L.layerGroup([
        L.tileLayer(esri + "Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16, attribution: "Tiles &copy; Esri" }),
        L.tileLayer(esri + "Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16 })
      ]).addTo(map);
      const street = L.tileLayer(esri + "World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 18, attribution: "Tiles &copy; Esri" });
      L.control.layers({ Dark: dark, Streets: street }, null, { position: "topright" }).addTo(map);
      const pts = [];
      for (const e of byCity.values()) {
        pts.push([e.lat, e.lng]);
        const top = [...e.venues.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);
        L.circleMarker([e.lat, e.lng], { radius: 5 + Math.sqrt(e.count) * 2, color: "#F2A541", weight: 1.5, fillColor: "#F2A541", fillOpacity: 0.45 })
          .bindPopup('<div class="pop"><strong>' + esc(e.city) + '</strong> <span class="muted">' + esc(e.country) + "</span><br>" + plural(e.count, "concert", "concerts") +
            "<ul>" + top.map(([n, k]) => "<li>" + esc(n) + " · " + k + "</li>").join("") + "</ul>" +
            '<button type="button" class="link"' + fattr("city", e.city) + ">See concerts</button></div>")
          .addTo(map);
      }
      map.fitBounds(pts, { padding: [30, 30], maxZoom: 7 });
    });
  }

  const viewHtml = () => ({ overview, concerts: concertList, artists: artistList, venues: venueList, festivals: festivalList, songs: songList, years: yearReview, map: mapView })[state.tab]();
  // re-render around a focused control without touching it: replacing a search box resets the iPhone keyboard to letters,
  // and focusing a fresh select reopens its picker
  function renderKeeping(id, wrap) {
    const live = document.getElementById(id), fresh = document.createElement("div");
    fresh.innerHTML = viewHtml();
    let k = live && (wrap ? live.closest(wrap) : live), f = fresh.querySelector("#" + id);
    f = f && (wrap ? f.closest(wrap) : f);
    if (!k || !f) return render();
    while (k !== app) {
      const before = [], after = [];
      for (let s = f.previousSibling; s; s = s.previousSibling) before.unshift(s);
      for (let s = f.nextSibling; s; s = s.nextSibling) after.push(s);
      while (k.previousSibling) k.previousSibling.remove();
      while (k.nextSibling) k.nextSibling.remove();
      before.forEach((n) => k.parentNode.insertBefore(n, k));
      after.forEach((n) => k.parentNode.appendChild(n));
      k = k.parentNode; f = f.parentNode;
    }
  }
  function render() {
    if (map) { map.remove(); map = null; }
    renderTabs();
    app.innerHTML = viewHtml();
    if (state.tab === "map") initMap();
    // years chart scrolls sideways on phones: start at the most recent years
    app.querySelectorAll(".years").forEach((el) => { el.scrollLeft = el.scrollWidth; });
  }
  // Every view change can be undone with Back. On desktop it is a browser history entry (browser Back works too);
  // on touch screens it is an in-app stack, so the iPhone edge swipe does not navigate inside the app.
  const useHistory = !window.matchMedia("(pointer: coarse)").matches;
  const stack = [];
  const snap = (n) => ({ n, tab: state.tab, detail: state.detail, filter: state.filter, artist: state.artist, year: state.year, q: state.q, shelfOnly: state.shelfOnly, scroll: window.scrollY });
  const depth = () => useHistory ? (history.state && history.state.n) || 0 : stack.length;
  const restore = (h) => {
    Object.assign(state, { tab: h.tab, detail: h.detail, filter: h.filter, artist: h.artist, year: h.year, q: h.q, shelfOnly: !!h.shelfOnly });
    render(); window.scrollTo(0, h.scroll || 0);
  };
  const go = (fn) => {
    if (useHistory) history.replaceState(snap(depth()), ""); else stack.push(snap(depth()));
    fn();
    if (useHistory) history.pushState(snap(depth() + 1), "");
    render(); window.scrollTo(0, 0);
  };
  const goBack = () => { if (useHistory) history.back(); else restore(stack.pop()); };
  if (useHistory) {
    history.replaceState(snap(0), "");
    window.addEventListener("popstate", (e) => { if (e.state) restore(e.state); });
  }

  // ---------- events ----------
  // capture phase: map popups stop click propagation, so listen before they do
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    const d = t.dataset;
    if (d.tab) go(() => { state.tab = d.tab; state.detail = null; state.filter = null; state.artist = null; });
    else if (d.open) go(() => { state.tab = "concerts"; state.detail = d.open; });
    else if (d.swap) { state.detail = d.swap; if (useHistory) history.replaceState(snap(depth()), ""); render(); window.scrollTo(0, 0); }
    else if (d.artist) go(() => { state.tab = "artists"; state.artist = d.artist; state.detail = null; });
    else if (d.f) go(() => { state.tab = "concerts"; state.detail = null; state.filter = { f: d.f, v: d.v, y: d.y || null }; state.q = ""; state.limits.concerts = 0; });
    else if (d.shelf) go(() => { state.tab = "artists"; state.artist = null; state.detail = null; state.shelfOnly = d.shelf === "1"; });
    else if (d.year) go(() => { state.year = d.year; });
    else if (d.yr) go(() => { state.tab = "years"; state.year = d.yr; state.detail = null; state.filter = null; state.artist = null; });
    else if (d.sort) {
      const [id, col, num] = d.sort.split("|");
      const cur = state.sorts[id];
      state.sorts[id] = cur && cur.col === +col ? { col: +col, dir: -cur.dir } : { col: +col, dir: num === "1" ? -1 : 1 };
      render();
    }
    else if (d.sortdir) { const st = state.sorts[d.sortdir]; if (st) { st.dir = -st.dir; render(); } }
    else if (d.more) { state.limits[d.more] = limitOf(d.more, 100) + 200; render(); }
    else if (t.id === "nextAll") { state.nextAll = !state.nextAll; render(); }
    else if (t.id === "clearf") { state.filter = null; state.limits.concerts = 0; render(); }
    else if (t.id === "back") { if (depth() > 0) goBack(); else go(() => { state.detail = null; }); }
    else if (t.id === "toAbout") {
      if (state.tab !== "overview" || state.detail || state.artist) go(() => { state.tab = "overview"; state.detail = null; state.filter = null; state.artist = null; });
      const el = document.getElementById("about"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    else if (t.id === "backArtists") go(() => { state.artist = null; });
    else if (t.id === "shareYear") shareYear(state.year);
  }, true);
  document.addEventListener("change", (e) => {
    if (e.target.id === "ysel") go(() => { state.year = e.target.value; });
    const ss = e.target.dataset && e.target.dataset.sortsel;
    if (ss) {
      const v = e.target.value, opt = e.target.options[e.target.selectedIndex];
      if (v === "") delete state.sorts[ss];
      else state.sorts[ss] = { col: +v, dir: opt.dataset.num === "1" ? -1 : 1 };
      renderKeeping("ms-" + ss);
    }
  });
  document.addEventListener("input", (e) => {
    if (e.target.id !== "q" && e.target.id !== "aq" && e.target.id !== "sq") return;
    const id = e.target.id;
    if (id === "q") { state.q = e.target.value; state.limits.concerts = 0; }
    else if (id === "aq") { state.artistQ = e.target.value; state.limits.artists = 0; }
    else { state.songQ = e.target.value; state.limits.songs = 0; }
    renderKeeping(id, ".search");
  });

  render();
})();
</script>
