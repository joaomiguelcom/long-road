      document.body.classList.toggle("fs-open", !!fsOpen);
      app.querySelectorAll(".fsheet").forEach((el) => el.classList.toggle("open", el.dataset.sheet === fsOpen));
      return;
    }
    if (d.unset && d.unset.startsWith("sort:")) { delete state.sorts[d.unset.slice(5)]; render(); return; }
    if (d.unset) { const k = d.unset; state[k] = typeof state[k] === "boolean" ? false : ""; if (k === "venueCountry") state.venueCity = ""; state.limits = {}; render(); return; }
    if (d.tab) {
      // a tab's list keeps its scroll position when you come back to it (only the plain list, not a page opened from it)
      const atList = !state.detail && !state.filter && !state.artist && !state.venue && !state.festival && !state.song;
      if (atList) tabScroll[state.tab] = window.scrollY; else delete tabScroll[state.tab];
      const back = d.tab !== state.tab ? tabScroll[d.tab] : 0;
      go(() => { state.tab = d.tab; state.detail = null; state.filter = null; state.artist = null; state.venue = null; state.festival = null; state.song = null; state.artistSet = null; });
      if (back) window.scrollTo(0, back);
    }
    else if (d.open) go(() => { state.tab = "concerts"; state.detail = d.open; });
    else if (d.swap) { state.detail = d.swap; if (useHistory) history.replaceState(snap(depth()), ""); render(); window.scrollTo(0, 0); }
    else if (d.artist) go(() => { state.tab = "artists"; state.artist = d.artist; state.detail = null; });
    else if (d.venue) go(() => { state.tab = "venues"; state.venue = d.venue; state.detail = null; });
    else if (d.song) go(() => { state.tab = "songs"; state.song = d.song; state.detail = null; });
    else if (d.fest) go(() => { state.tab = "festivals"; state.festival = d.fest; state.detail = null; });
    else if (d.f) go(() => { state.tab = "concerts"; state.detail = null; state.filter = { f: d.f, v: d.v, y: d.y || null }; state.q = ""; state.limits.concerts = 0; });
    else if (d.aset !== undefined) go(() => { state.tab = "artists"; state.artist = null; state.detail = null; state.artistSet = d.aset || null; state.shelfOnly = false; state.artistQ = ""; state.limits.artists = 0; });
    else if (d.kind !== undefined) { state.kind = d.kind; state.limits.concerts = 0; render(); }
    else if (d.mkind !== undefined) { state.mapKind = d.mkind; render(); }
    else if (d.mview) { if (map) map.area(d.mview); else mapArea = d.mview; }
    else if (d.mzoom) { if (map) map.zoomBy(+d.mzoom); }
    else if (d.expand) { opened.has(d.expand) ? opened.delete(d.expand) : opened.add(d.expand); render(); }
    else if (d.clear) {
      if (d.clear === "concerts") Object.assign(state, { kind: "", country: "", cYear: "", q: "", filter: null });
      if (d.clear === "venues") Object.assign(state, { venueCountry: "", venueCity: "", venueQ: "" });
      if (d.clear === "artists") Object.assign(state, { shelfOnly: false, artistQ: "", artistSet: null });
      if (d.clear === "festivals") Object.assign(state, { festCountry: "", festQ: "" });
      if (d.clear === "map") Object.assign(state, { mapKind: "", mapYears: "" });
      delete state.sorts[d.clear];
      state.limits = {}; render();
    }
    else if (d.shelf) go(() => { state.tab = "artists"; state.artist = null; state.detail = null; state.shelfOnly = d.shelf === "1"; });
    else if (d.year) go(() => { state.year = d.year; });
    else if (d.yr) go(() => { state.tab = "years"; state.year = d.yr; state.detail = null; state.filter = null; state.artist = null; state.venue = null; state.festival = null; state.song = null; });
    else if (d.sort) {
      const [id, col, num] = d.sort.split("|");
      const cur = state.sorts[id];
      state.sorts[id] = cur && cur.col === +col ? { col: +col, dir: -cur.dir } : { col: +col, dir: num === "1" ? -1 : 1 };
      render();
    }
    else if (d.sortdir) { const st = state.sorts[d.sortdir]; if (st) { st.dir = -st.dir; render(); } }
    else if (d.more) { const n = +d.shown; state.limits[d.more] = n < 100 ? n * 3 : n + 200; render(); }
    else if (t.id === "nextAll") { state.nextAll = !state.nextAll; render(); }
    else if (d.clearf) { state.filter = null; state.limits.concerts = 0; render(); }
    else if (t.id === "back") { if (depth() > 0) goBack(); else go(() => { state.detail = null; }); }
    else if (t.id === "bMore") { moreOpen = !moreOpen; renderBottomNav(); }
    else if (t.id === "toTop") window.scrollTo({ top: 0, behavior: "smooth" });
    else if (t.id === "theme") setTheme(!isLight());
    else if (t.id === "shareLink") shareLink();
    else if (t.id === "toAbout") {
      if (state.tab !== "overview" || state.detail || state.artist || state.venue || state.festival || state.song) go(() => { state.tab = "overview"; state.detail = null; state.filter = null; state.artist = null; state.venue = null; state.festival = null; state.song = null; });
      const el = document.getElementById("about"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    else if (t.id === "backArtists") go(() => { state.artist = null; });
    else if (t.id === "backVenues") go(() => { state.venue = null; });
    else if (t.id === "backFestivals") go(() => { state.festival = null; });
    else if (t.id === "backSongs") go(() => { state.song = null; });
    else if (t.id === "shareYear") shareYear(state.year);
    else if (d.shareConcert) shareConcert(d.shareConcert);
  }, true);
  document.addEventListener("change", (e) => {
    // renderKeeping keeps the chip around a kept select, so mark it here
    const pick = e.target.closest(".qpick");
    if (pick) pick.classList.toggle("on", !!e.target.value);
    if (e.target.id === "ysel") go(() => { state.year = e.target.value; });
    if (e.target.id === "vcsel") { state.venueCountry = e.target.value; state.venueCity = ""; renderKeeping("vcsel"); return; }
    if (e.target.id === "vsel") { state.venueCity = e.target.value; renderKeeping("vsel"); return; }
    if (e.target.id === "msel") { state.mapYears = e.target.value; render(); return; }
    if (e.target.id === "cysel") { state.cYear = e.target.value; state.limits.concerts = 0; renderKeeping("cysel"); return; }
    if (e.target.id === "fcsel") { state.festCountry = e.target.value; renderKeeping("fcsel"); return; }
    if (e.target.id === "csel") { state.country = e.target.value; state.limits.concerts = 0; renderKeeping("csel"); }
    const ss = e.target.dataset && e.target.dataset.sortsel;
    if (ss) {
      const v = e.target.value, opt = e.target.options[e.target.selectedIndex];
      if (v === "") delete state.sorts[ss];
      else state.sorts[ss] = { col: +v, dir: opt.dataset.num === "1" ? -1 : 1 };
      renderKeeping("ms-" + ss);
    }
  });
  document.addEventListener("input", (e) => {
    if (!["q", "aq", "vq", "sq", "fq", "cvq", "dbq"].includes(e.target.id)) return;
    const id = e.target.id;
    if (id === "q") { state.q = e.target.value; state.limits.concerts = 0; }
    else if (id === "aq") { state.artistQ = e.target.value; state.limits.artists = 0; }
    else if (id === "vq") { state.venueQ = e.target.value; state.limits.venues = 0; }
    else if (id === "fq") state.festQ = e.target.value;
    else if (id === "cvq") { state.coverQ = e.target.value; state.limits.covers = 0; }
    else if (id === "dbq") { state.debutQ = e.target.value; state.limits.debuts = 0; }
    else { state.songQ = e.target.value; state.limits.songs = 0; }
    renderKeeping(id, ".search");
  });

  render();
})();
</script>
