name: Debug upcoming (temporary)
on: workflow_dispatch
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -A "Mozilla/5.0 (Long Road backup)" -H "Accept-Language: en" https://www.setlist.fm/attended/ojoaomiguel -o page.html -w "HTTP %{http_code} %{size_download}\n"
          grep -o -i "upcoming[^<]\{0,40\}" page.html | head
          python3 - <<'PY'
          s = open("page.html", encoding="utf-8", errors="replace").read()
          i = s.find("Upcoming Shows")
          print("index", i)
          if i >= 0: print(s[i-300:i+3500])
          PY
