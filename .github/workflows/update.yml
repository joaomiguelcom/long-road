name: Update concerts

on:
  schedule:
    - cron: "0 6 1,15 * *"   # 06:00 UTC on the 1st and 15th of each month
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]          # redeploy the site when the app changes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Export from setlist.fm
        if: github.event_name != 'push'
        shell: pwsh
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: ./export.ps1

      - name: Commit backup
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update concerts $(date -u +%F)"
            git push
          fi

      - name: Build site
        run: |
          mkdir -p _site
          cp index.html _site/
          if [ -d data ]; then cp -r data _site/; fi
          # Build id: lets the home-screen app notice new deploys and skip stale caches
          BUILD="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$BUILD/g" _site/index.html
          echo "$BUILD" > _site/version.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
