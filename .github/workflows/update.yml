name: Update concerts

on:
  schedule:
    - cron: "0 6 1,15 * *"   # 06:00 UTC on the 1st and 15th of each month
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]          # redeploy the site when the app changes

permissions:
  contents: write
  pages: write
  id-token: write

# App changes (push) only redeploy, so a newer push replaces an older one still waiting;
# exports never get cancelled halfway.
concurrency:
  group: update-${{ github.event_name == 'push' && 'deploy' || 'export' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Export from setlist.fm
        if: github.event_name != 'push'
        shell: pwsh
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: ./export.ps1

      - name: Export Discogs collection
        if: github.event_name != 'push'
        continue-on-error: true   # a Discogs hiccup must not block the concert backup
        run: node tools/discogs.mjs

      - name: Export artist popularity
        if: github.event_name != 'push'
        continue-on-error: true   # only used to break ties in the Year in review
        run: node tools/popularity.mjs

      - name: Commit backup
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update concerts $(date -u +%F)"
            git push
          fi

      - name: Build site
        run: |
          mkdir -p _site
          cp index.html upcoming.js extra.js widget.js manifest.webmanifest sw.js _site/ && cp -r vendor _site/
          # the app only reads these three; the raw exports stay in the repo
          mkdir -p _site/data && cp data/data.js _site/data/ && { cp data/discogs.js _site/data/ || true; } && { cp data/popularity.js _site/data/ || true; }
          # the published data.js leaves out empty fields (about half the size); the repo keeps the full export
          node tools/slim-data.cjs _site/data/data.js
          # calendar of booked shows that João's phone subscribes to
          node tools/calendar.cjs _site
          if [ -d img ]; then cp -r img _site/; fi
          # Build id: lets the home-screen app notice new deploys and skip stale caches
          BUILD="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$BUILD/g" _site/index.html
          echo "$BUILD" > _site/version.txt

      # comments stay in the repo; the published files go out without them
      - name: Strip comments
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/min" html-minifier-terser@7.2.0 terser@5.36.0
          NODE_PATH="$RUNNER_TEMP/min/node_modules" node tools/strip-comments.cjs _site

      # opens the built site in Chrome and stops the deploy if the app breaks
      - name: Smoke test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright-core@1.56.1
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tools/smoke.cjs _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
